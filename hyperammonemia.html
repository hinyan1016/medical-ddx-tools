<script>
// ===== 単位換算 =====
function convertFromUg(val) {
  var umolEl = document.getElementById("umolInput");
  var noteEl = document.getElementById("convNote");
  var num = parseFloat(val);
  if (isNaN(num) || val === "") {
    umolEl.value = "";
    noteEl.textContent = "1 μg/dL ≈ 0.587 μmol/L（100 μmol/L ≈ 170 μg/dL）";
    return;
  }
  var umol = (num * 0.5872).toFixed(1);
  umolEl.value = umol;
  var stage = "";
  if (umol >= 150) stage = " 【>150 μmol/L：腎代替療法による早期体外除去を検討】";
  else if (umol >= 100) stage = " 【>100 μmol/L：先天代謝異常症の評価・相談を検討】";
  else if (umol >= 60) stage = " 【60-100 μmol/L：冷却再検と原因検索・治療】";
  noteEl.textContent = num + " μg/dL = " + umol + " μmol/L" + stage;
}

function convertFromUmol(val) {
  var ugEl = document.getElementById("ugInput");
  var noteEl = document.getElementById("convNote");
  var num = parseFloat(val);
  if (isNaN(num) || val === "") {
    ugEl.value = "";
    noteEl.textContent = "1 μg/dL ≈ 0.587 μmol/L（100 μmol/L ≈ 170 μg/dL）";
    return;
  }
  var ug = (num / 0.5872).toFixed(0);
  ugEl.value = ug;
  var stage = "";
  if (num >= 150) stage = " 【>150 μmol/L：腎代替療法による早期体外除去を検討】";
  else if (num >= 100) stage = " 【>100 μmol/L：先天代謝異常症の評価・相談を検討】";
  else if (num >= 60) stage = " 【60-100 μmol/L：冷却再検と原因検索・治療】";
  noteEl.textContent = num + " μmol/L ≈ " + ug + " μg/dL" + stage;
}

// ===== 疾患データ =====

    workup: "冷却したEDTA管に採血し、ベッドサイドで直ちに氷冷して30〜60分以内に再測定。施設基準上限との比（AMM-ULN）も参考にする。"
  },

// ===== スコアリングロジック =====
function calcScores(answers) {
  var scores = {};
  var keys = Object.keys(DISEASES);
  var i;
  for (i = 0; i < keys.length; i++) {
    scores[keys[i]] = 0;
  }

  // Step 1: 検体条件
  var smp = answers.sample;
  if (smp === "delayed") {
    scores.pseudo += 9;
  } else if (smp === "unknown_sample") {
    scores.pseudo += 4;
  } else if (smp === "proper") {
    scores.pseudo -= 6;
  }

  // Step 2: 重症度・数値
  var sev = answers.level_severity;
  if (sev === "asymptomatic_mild") {
    scores.pseudo += 4;
    scores.vpa += 4;
    scores.postictal += 2;
    scores.otcd -= 1;
  } else if (sev === "mod_60_100") {
    scores.postictal += 4;
    scores.vpa += 3;
    scores.hepatic += 3;
    scores.renal_gi += 3;
    scores.obstructive_uti += 2;
  } else if (sev === "high_100_150") {
    scores.otcd += 4;
    scores.obstructive_uti += 4;
    scores.pss += 4;
    scores.hepatic += 3;
    scores.vpa += 3;
    scores.renal_gi += 3;
    scores.pseudo -= 2;
  } else if (sev === "critical_150") {
    scores.otcd += 6;
    scores.pss += 6;
    scores.obstructive_uti += 5;
    scores.hepatic += 4;
    scores.other_drugs += 3;
    scores.pseudo -= 4;
  }

  // Step 3: 肝疾患背景
  var liv = answers.liver_status;
  if (liv === "cirrhosis_alf") {
    scores.hepatic += 9;
  } else if (liv === "no_liver_disease") {
    scores.hepatic -= 6;
    scores.postictal += 2;
    scores.vpa += 2;
    scores.obstructive_uti += 2;
    scores.pss += 2;
    scores.otcd += 2;
    scores.renal_gi += 2;
  } else if (liv === "shunt_known") {
    scores.pss += 7;
    scores.hepatic -= 3;
  }

  // Step 4: けいれん・意識推移
  var sz = answers.seizure_neuro;
  if (sz === "post_gtcs_recovering") {
    scores.postictal += 8;
    scores.otcd -= 1;
  } else if (sz === "post_seizure_prolonged") {
    scores.otcd += 4;
    scores.vpa += 3;
    scores.obstructive_uti += 3;
    scores.pss += 3;
    scores.postictal -= 3;
  } else if (sz === "focal_or_pnes") {
    scores.postictal -= 6;
    scores.pseudo += 2;
    scores.vpa += 2;
    scores.otcd += 2;
  } else if (sz === "encephalopathy_no_conv") {
    scores.hepatic += 2;
    scores.obstructive_uti += 3;
    scores.pss += 3;
    scores.vpa += 2;
    scores.otcd += 3;
    scores.postictal -= 6;
  } else if (sz === "no_seizure_no_encephalopathy") {
    scores.pseudo += 4;
    scores.vpa += 4;
    scores.hepatic += 1;
    scores.pss += 1;
    scores.postictal -= 8;
  }

  // Step 5: 薬剤歴
  var meds = answers.medications || [];
  for (i = 0; i < meds.length; i++) {
    if (meds[i] === "vpa_use") {
      scores.vpa += 8;
      scores.otcd += 2; // VPAは遅発型OTCDの顕在化誘因にもなる
    }
    if (meds[i] === "topiramate_carnitine") {
      scores.vpa += 4;
    }
    if (meds[i] === "steroid_use") {
      scores.otcd += 4;
      scores.other_drugs += 3;
      scores.renal_gi += 2;
    }
    if (meds[i] === "chemo_use") {
      scores.other_drugs += 8;
      scores.otcd += 2;
    }
    if (meds[i] === "other_asm") {
      scores.other_drugs += 4;
    }
  }

  // Step 6: 尿路・消化管・解剖・全身
  var ugs = answers.uti_gi_shunt || [];
  for (i = 0; i < ugs.length; i++) {
    if (ugs[i] === "urinary_retention_alkaline") {
      scores.obstructive_uti += 9;
    }
    if (ugs[i] === "constipation_ileus") {
      scores.pss += 5;
      scores.hepatic += 3;
    }
    if (ugs[i] === "portosystemic_shunt") {
      scores.pss += 8;
    }
    if (ugs[i] === "gi_bleeding") {
      scores.hepatic += 4;
      scores.renal_gi += 5;
      scores.pss += 2;
    }
    if (ugs[i] === "aki_ckd") {
      scores.renal_gi += 6;
    }
    if (ugs[i] === "high_tumor") {
      scores.renal_gi += 6;
      scores.other_drugs += 2;
    }
  }

  // Step 7: 代謝異常・栄養の手がかり
  var met = answers.metabolic_clues || [];
  for (i = 0; i < met.length; i++) {
    if (met[i] === "postpartum") {
      scores.otcd += 7;
    }
    if (met[i] === "fasting_catabolism") {
      scores.otcd += 4;
      scores.renal_gi += 3;
    }
    if (met[i] === "protein_load_tpn") {
      scores.otcd += 5;
      scores.renal_gi += 4;
    }
    if (met[i] === "bariatric_surgery") {
      scores.otcd += 5;
      scores.renal_gi += 4;
    }
    if (met[i] === "protein_aversion") {
      scores.otcd += 8;
    }
    if (met[i] === "family_episodic") {
      scores.otcd += 6;
    }
  }

  return scores;
}

function getProbLevel(score, maxScore) {
  if (maxScore <= 0) return "very_low";
  var ratio = score / maxScore;
  if (ratio >= 0.65 && score >= 5) return "high";
  if (ratio >= 0.35 && score >= 3) return "moderate";
  if (score >= 2) return "low";
  return "very_low";
}

function getProbLabel(level) {
  if (level === "high") return "可能性 高";
  if (level === "moderate") return "可能性 中";
  if (level === "low") return "可能性 低";
  return "可能性 極低";
}

// ===== UI状態 =====
var app = document.getElementById("app");
var currentStep = 0;
var answers = {};

function render() {
  var html = "";
  var i, j, step, opt, isActive, isDone, cls, selected, checked, currentAnswers;

  // アルゴリズムノート
  html += '<div class="algo-note">';
  html += '<strong>💡 鑑別の4原則：</strong><br>';
  html += '<strong>① 測定条件の確認：</strong>室温放置や搬送遅延による偽高値を除外（冷却EDTA管・氷冷・30〜60分以内の測定が鉄則）。<br>';
  html += '<strong>② 肝硬変での解釈：</strong>アンモニア正常は顕性肝性脳症に対する陰性的中率が高い（正常なら他原因を検索）。一方、高値単独では肝性脳症の診断は決まらない。<br>';
  html += '<strong>③ 非肝性原因の整理：</strong>けいれん後（一過性）・バルプロ酸・閉塞性尿路感染（ウレアーゼ産生菌）・門脈大循環シャント・遅発型OTCDを系統的に確認。<br>';
  html += '<strong>④ 重症例の段階的対応：</strong>＞100 μmol/Lで先天代謝異常症の評価・相談、＞150 μmol/Lで腎代替療法による早期体外除去を並行検討。';
  html += '</div>';

  // プログレスバー
  html += '<div class="progress-bar">';
  for (i = 0; i < STEPS.length; i++) {
    if (i > 0) {
      html += '<div class="progress-line' + (i <= currentStep ? ' done' : '') + '"></div>';
    }
    var dotCls = "";
    if (i < currentStep) dotCls = " done";
    else if (i === currentStep) dotCls = " active";
    html += '<div class="progress-dot' + dotCls + '" onclick="jumpToStep(' + i + ')">';
    if (i < currentStep) {
      html += '&#10003;';
    } else {
      html += (i + 1);
    }
    html += '</div>';
  }
  html += '</div>';

  // 各ステップ
  for (i = 0; i < STEPS.length; i++) {
    step = STEPS[i];
    isActive = (i === currentStep);
    isDone = (i < currentStep);
    cls = isDone ? "completed" : (isActive ? "" : "inactive");

    html += '<div class="step-card ' + cls + '" id="step-' + i + '">';
    html += '<div class="step-header" onclick="jumpToStep(' + i + ')">';
    html += '<span class="step-number ' + (isDone ? 'done' : '') + '">' + (isDone ? '&#10003;' : (i + 1)) + '</span>';
    html += '<div class="step-title-wrap">';
    html += '<div class="step-title">' + step.title + '</div>';
    if (step.subtitle) {
      html += '<div class="step-subtitle">' + step.subtitle + '</div>';
    }
    html += '</div>';
    html += '</div>';

    if (isActive || isDone) {
      html += '<div class="step-body">';

      if (step.type === "single") {
        html += '<div class="option-group">';
        for (j = 0; j < step.options.length; j++) {
          opt = step.options[j];
          selected = (answers[step.id] === opt.id);
          html += '<button class="option-btn' + (selected ? ' selected' : '') + '"';
          html += ' onclick="selectSingle(\'' + step.id + '\', \'' + opt.id + '\', ' + i + ')"';
          if (isDone && !isActive) html += ' disabled';
          html += '>';
          html += '<span class="icon">' + (opt.icon || '') + '</span><span>' + opt.label + '</span>';
          html += '</button>';
        }
        html += '</div>';
      } else {
        currentAnswers = answers[step.id] || [];
        html += '<div class="checklist">';
        for (j = 0; j < step.options.length; j++) {
          opt = step.options[j];
          checked = false;
          for (var k = 0; k < currentAnswers.length; k++) {
            if (currentAnswers[k] === opt.id) { checked = true; break; }
          }
          html += '<div class="check-item' + (checked ? ' checked' : '') + '"';
          html += ' onclick="toggleCheck(\'' + step.id + '\', \'' + opt.id + '\')">';
          html += '<input type="checkbox"' + (checked ? ' checked' : '') + '>';
          html += '<label><span class="icon" style="margin-right:6px;">' + (opt.icon || '') + '</span>' + opt.label + '</label>';
          html += '</div>';
        }
        html += '</div>';
        if (isActive) {
          html += '<p style="font-size:0.84em;color:#666;margin:10px 0 4px;">該当する項目を選択して「次へ」を押してください（該当なしの場合はそのまま「次へ」）</p>';
          html += '<button class="next-btn" onclick="nextStep(' + i + ')">' + (i === STEPS.length - 1 ? '鑑別結果を表示 &#9654;' : '次へ &#9654;') + '</button>';
        }
      }

      html += '</div>';
    }
    html += '</div>';
  }

  // 結果パネル
  if (currentStep >= STEPS.length) {
    html += renderResults();
  }

  // リセットボタン
  if (currentStep > 0) {
    html += '<button class="reset-btn" onclick="resetAll()">&#128260; 最初からやり直す</button>';
  }

  app.innerHTML = html;

  if (currentStep >= STEPS.length) {
    setTimeout(function() {
      var panel = document.querySelector('.result-panel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function selectSingle(stepId, value, stepIndex) {
  answers[stepId] = value;
  currentStep = stepIndex + 1;
  render();
  scrollToStep(currentStep);
}

function toggleCheck(stepId, value) {
  if (!answers[stepId]) answers[stepId] = [];
  var idx = -1;
  for (var i = 0; i < answers[stepId].length; i++) {
    if (answers[stepId][i] === value) { idx = i; break; }
  }
  if (idx >= 0) {
    answers[stepId].splice(idx, 1);
  } else {
    answers[stepId].push(value);
  }
  render();
}

function nextStep(stepIndex) {
  currentStep = stepIndex + 1;
  render();
  scrollToStep(currentStep);
}

function jumpToStep(idx) {
  if (idx <= currentStep) {
    currentStep = idx;
    render();
  }
}

function scrollToStep(idx) {
  setTimeout(function() {
    var el = document.getElementById('step-' + idx) || document.querySelector('.result-panel');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function resetAll() {
  var keys = Object.keys(answers);
  for (var i = 0; i < keys.length; i++) {
    delete answers[keys[i]];
  }
  currentStep = 0;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleDetail(cardId) {
  var detail = document.getElementById('detail-' + cardId);
  var workup = document.getElementById('workup-' + cardId);
  var toggle = document.getElementById('toggle-' + cardId);
  if (detail) {
    if (detail.className.indexOf('open') >= 0) {
      detail.className = 'dx-detail';
      if (workup) workup.className = 'dx-workup';
      if (toggle) toggle.textContent = '詳細・対応を表示 ▼';
    } else {
      detail.className = 'dx-detail open';
      if (workup) workup.className = 'dx-workup open';
      if (toggle) toggle.textContent = '詳細を閉じる ▲';
    }
  }
}

function renderResults() {
  var scores = calcScores(answers);
  var entries = [];
  var keys = Object.keys(scores);
  var i;
  for (i = 0; i < keys.length; i++) {
    if (scores[keys[i]] > 0) {
      entries.push({ id: keys[i], score: scores[keys[i]] });
    }
  }
  entries.sort(function(a, b) { return b.score - a.score; });

  var maxScore = entries.length > 0 ? entries[0].score : 0;

  var html = '<div class="result-panel show">';
  html += '<div class="result-header">&#128203; 高アンモニア血症 鑑別診断と初期対応</div>';
  html += '<div class="result-body">';

  // 状況別クリティカル・アラート
  var alerts = [];
  var sev = answers.level_severity;
  var meds = answers.medications || [];
  var ugs = answers.uti_gi_shunt || [];
  var sz = answers.seizure_neuro;

  if (sev === "critical_150") {
    alerts.push('<strong>＞150 μmol/L（または重篤な脳症・てんかん重積）：</strong>脳浮腫と不可逆的な神経障害を防ぐため、原因検索・被疑薬中止・原因除去と並行して、<strong>腎代替療法（血液透析・持続血液濾過透析など）による早期の体外アンモニア除去</strong>を検討してください（Long &amp; Coursinの枠組み / Kawakami 2023）。');
  } else if (sev === "high_100_150") {
    alerts.push('<strong>＞100 μmol/L（急性脳症）：</strong>遅発型尿素サイクル異常症（OTCDなど）を念頭に置いた検体採取（血漿アミノ酸分析・尿中オロト酸など）と、遺伝・代謝診療チームへの早期コンサルトを検討してください。');
  }

  var hasUti = ugs.indexOf("urinary_retention_alkaline") >= 0;
  var hasVpa = meds.indexOf("vpa_use") >= 0;
  if (hasUti) {
    alerts.push('<strong>閉塞性尿路感染症のピットフォール：</strong>高アンモニア脳症の前頭部律動性デルタ波や意識変容を<strong>非けいれん性てんかん重積状態（NCSE）と誤診してバルプロ酸を追加すると、アンモニアが急上昇して重篤化する</strong>報告があります（Lee 2023）。速やかな膀胱カテーテル留置（尿閉解除）と抗菌薬投与を優先してください。');
  }
  if (hasVpa && (sev === "asymptomatic_mild" || sz === "no_seizure_no_encephalopathy")) {
    alerts.push('<strong>無症候性のバルプロ酸関連高アンモニア血症：</strong>精神科入院患者347人の研究ではVPA投与中の36%に高アンモニア血症を認めましたが、半数以上は無症候性でした（Baddour 2018）。無症候例でのルーチン測定や数値のみを理由とした直ちの中止は必須ではなく、傾眠・嘔吐・錯乱などの症状出現時やトピラマート併用時に中止・レボカルニチン補充を検討します。');
  }
  if (sz === "post_gtcs_recovering" && answers.liver_status === "no_liver_disease" && !hasVpa) {
    alerts.push('<strong>全般性けいれん発作後の一過性上昇：</strong>全身けいれん直後のアンモニア上昇は骨格筋収縮に伴う一過性の産生増加で説明できることが多く、意識が順調に回復していれば特別なアンモニア低下薬なしで<strong>24〜48時間でベースラインへ自然低下</strong>します（Albadareen 2016 / Puppala 2025）。再検で低下を確認してください。');
  }

  if (alerts.length > 0) {
    html += '<div class="alert-box' + (sev === "critical_150" || hasUti ? ' danger' : '') + '">';
    html += '<div class="alert-title">&#128680; 臨床判断の重要ポイント</div>';
    for (i = 0; i < alerts.length; i++) {
      html += '<div style="margin-bottom:6px;">・' + alerts[i] + '</div>';
    }
    html += '</div>';
  }

  // 鑑別診断リスト
  html += '<p style="margin-bottom:12px; color:#555; font-size:0.88em;">カードをクリックすると病態の詳細と推奨ワークアップが開きます（上位2疾患は初期表示で開いています）。</p>';

  if (entries.length === 0) {
    html += '<p style="color:var(--gray);text-align:center;padding:20px;">入力された情報からは特定の原因が強く示唆されませんでした。冷却採血での再検と基本検査（肝腎機能・尿検査・血液ガス・薬剤歴）を確認してください。</p>';
  } else {
    for (i = 0; i < entries.length; i++) {
      var d = DISEASES[entries[i].id];
      var level = getProbLevel(entries[i].score, maxScore);
      var levelLabel = getProbLabel(level);
      var cardId = entries[i].id;
      var isOpen = (i < 2);

      html += '<div class="dx-card ' + level + '" onclick="toggleDetail(\'' + cardId + '\')">';
      html += '<div class="dx-top">';
      html += '<div class="dx-name">';
      html += '<span>' + d.emoji + '</span>';
      html += '<span>' + d.name + '</span>';
      html += '</div>';
      html += '<span class="prob-badge">' + levelLabel + '</span>';
      html += '</div>';

      html += '<span class="category-label ' + d.catClass + '">' + d.category + '</span>';
      html += '<div class="dx-toggle" id="toggle-' + cardId + '">' + (isOpen ? '詳細を閉じる ▲' : '詳細・対応を表示 ▼') + '</div>';
      html += '<div class="dx-detail' + (isOpen ? ' open' : '') + '" id="detail-' + cardId + '">' + d.detail + '</div>';
      html += '<div class="dx-workup' + (isOpen ? ' open' : '') + '" id="workup-' + cardId + '">&#128269; <strong>確認検査・初期対応：</strong>' + d.workup + '</div>';
      html += '</div>';
    }
  }

  // 原因未確定の重症例に対する3段階アプローチ表
  html += '<div class="summary-box" style="margin-top:18px;">';
  html += '<div class="summary-title">&#127919; 原因未確定の成人非肝性高アンモニア血症：3段階の実践的対応目安（Long &amp; Coursinの提案）</div>';
  html += '<table class="step-table">';
  html += '<thead><tr><th>血中アンモニア値の目安</th><th>推奨される診断・初期対応のステップ</th></tr></thead>';
  html += '<tbody>';
  html += '<tr><td><strong>60〜100 μmol/L</strong><br><span style="font-size:0.85em;color:#555;">（約102〜170 μg/dL）</span></td><td>冷却採血でアンモニア値を綿密にフォローアップし、疑われる原因（けいれん後、薬剤、便秘・消化管出血、尿閉・尿路感染、腎障害など）の検索と原因治療を開始する</td></tr>';
  html += '<tr><td><strong>＞100 μmol/L</strong><br><span style="font-size:0.85em;color:#555;">（約170 μg/dL超）</span></td><td>上記に加え、先天代謝異常症（遅発型尿素サイクル異常症など）を念頭に置いた検体採取（血漿アミノ酸・尿中オロト酸など）と治療を検討し、遺伝・代謝診療チームへコンサルトする</td></tr>';
  html += '<tr><td><strong>＞150 μmol/L</strong><br><span style="font-size:0.85em;color:#555;">（約255 μg/dL超）</span></td><td>原因検索や内科的治療・原因除去と並行して、<strong>腎代替療法（血液透析・持続血液濾過透析など）による体外からの早期アンモニア除去</strong>を検討する</td></tr>';
  html += '</tbody></table>';
  html += '</div>';

  // 見逃し防止チェックリスト
  html += '<div class="red-flag-box">';
  html += '<div class="rf-title">&#9888;&#65039; 非肝性高アンモニア血症の見逃し防止チェックリスト</div>';
  html += '<ul>';
  html += '<li><strong>検体条件：</strong>室温放置・搬送遅延による偽高値ではないか？（冷却EDTA管・氷冷速測定で再検）</li>';
  html += '<li><strong>尿閉＋アルカリ尿：</strong>高齢者の意識障害で膀胱拡張とウレアーゼ産生菌尿路感染を見落としていないか？</li>';
  html += '<li><strong>NCSE誤診とVPA追加：</strong>高アンモニア脳症の脳波異常にバルプロ酸を追加して悪化させていないか？</li>';
  html += '<li><strong>門脈大循環シャント＋便秘：</strong>肝硬変がなくてもシャント＋宿便性腸閉塞で重篤な脳浮腫を起こしうる。</li>';
  html += '<li><strong>遅発型OTCDの手がかり：</strong>産褥期・ステロイド・絶食・高蛋白負荷後の発症や「以前から肉を避けていた（蛋白嫌悪）」病歴はないか？（ラクツロース単独では改善しない）</li>';
  html += '</ul>';
  html += '</div>';

  // 主要文献
  html += '<div class="ref-box">';
  html += '<strong>📚 主な根拠文献（詳細は<a href="https://blog.ichisouzo-lab.com/entry/2026/10/21/084039" target="_blank" rel="noopener">解説ブログ記事</a>を参照）：</strong>';
  html += '<ol>';
  html += '<li>Ballester MP, et al. The Value of Ammonia as a Biomarker in Patients with Cirrhosis. <em>Semin Liver Dis</em>. 2024;44(3):356-368. PMID: 39095029.</li>';
  html += '<li>Sakusic A, et al. Features of Adult Hyperammonemia Not Due to Liver Failure in the ICU. <em>Crit Care Med</em>. 2018;46(9):e897-e903. PMID: 29985210.</li>';
  html += '<li>Kim JH, et al. Impact of non-hepatic hyperammonemia on mortality in intensive care unit patients. <em>Korean J Intern Med</em>. 2021;36(6):1347-1355. PMID: 34256430.</li>';
  html += '<li>Albadareen R, et al. Postictal ammonia as a biomarker for electrographic convulsive seizures. <em>Epilepsia</em>. 2016;57(8):1221-1227. PMID: 27245120.</li>';
  html += '<li>Puppala S, et al. Serum Ammonia as a Biomarker to Differentiate Between True Epileptic and Psychogenic Non-epileptic Seizures. <em>Ann Neurosci</em>. 2025. PMID: 40177522.</li>';
  html += '<li>Baddour E, et al. Valproic acid-induced hyperammonemia: Incidence, clinical significance, and treatment management. <em>Ment Health Clin</em>. 2018;8(2):73-77. PMID: 29955549.</li>';
  html += '<li>Lee Y, et al. Urinary-Tract-Infection Induced Noncirrhotic Hyperammonemic Encephalopathy Mimicking Nonconvulsive Status Epilepticus. <em>J Clin Neurol</em>. 2023;19(6):627-629. PMID: 37901902.</li>';
  html += '<li>Kawakami T, et al. Severe Hyperammonemia Due to Fecal Bowel Obstruction With a Congenital Portosystemic Shunt. <em>Cureus</em>. 2023;15(7):e42452. PMID: 37637566.</li>';
  html += '<li>Konczal L, et al. Emerging neurological and cognitive symptoms in patients with late-onset ornithine transcarbamylase deficiency. <em>Metab Brain Dis</em>. 2026;41(1):54. PMID: 41824151.</li>';
  html += '</ol>';
  html += '<p style="margin-top:8px;">監修：今村久司（滋賀県の脳神経内科医。京都大学医学部卒・医学博士。脳神経内科専門医・指導医、総合内科専門医・指導医、てんかん専門医・指導医）。本ツールは医療従事者向けの臨床判断補助であり、確定診断を行うものではありません。</p>';
  html += '</div>';

  html += '</div></div>';
  return html;
}

// 初期描画
render();
