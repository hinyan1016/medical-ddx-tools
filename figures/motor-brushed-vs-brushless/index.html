<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ブラシ付きモーターとブラシレスモーター（動く図）</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--mt-jp:"BIZ UDPGothic","BIZ UDPゴシック","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --mt-on-0:#e8590c;--mt-on-1:#f76707;--mt-on-2:#fd7e14;--mt-on-3:#ff922b;--mt-on-top:#ffc078;--mt-on-edge:#a63c06;
  --mt-spark-glow:#ffd43b;--mt-spark-ray:#f76707;--mt-spark-core:#fff3bf;
  --mt-north:rgba(0,0,0,.16);--mt-north-blend:multiply}
.iso[data-theme="dark"],.iso:not([data-theme]){--mt-on-0:#c2410c;--mt-on-1:#e8590c;--mt-on-2:#f76707;--mt-on-3:#fd7e14;--mt-on-top:#ffa94d;--mt-on-edge:#ffd8a8;
  --mt-spark-glow:#ffa94d;--mt-spark-ray:#ffd43b;--mt-spark-core:#ffffff;
  --mt-north:rgba(255,255,255,.13);--mt-north-blend:screen}
body{font-family:var(--mt-jp)}
.iso-plate-corner{font-family:var(--mt-jp)!important;text-transform:none!important;letter-spacing:.05em!important;font-size:11.5px!important}
.iso-legend,.iso-caption{font-family:var(--mt-jp);word-break:auto-phrase;line-break:strict}
.iso-caption{display:block;color:var(--anatomy-text);font-size:14px;line-height:1.85}
.iso-key{font-size:13px}
.mt-stage{position:relative;touch-action:pan-y;outline:none;cursor:ew-resize}
.mt-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.mt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 電気が流れているコイル：--on（0〜1）で色を混ぜる */
.mt-coil .iso-shade[data-shade="0"]{fill:color-mix(in srgb,var(--mt-on-0) calc(var(--on,0)*100%),var(--anatomy-shade-0))}
.mt-coil .iso-shade[data-shade="1"]{fill:color-mix(in srgb,var(--mt-on-1) calc(var(--on,0)*100%),var(--anatomy-shade-1))}
.mt-coil .iso-shade[data-shade="2"]{fill:color-mix(in srgb,var(--mt-on-2) calc(var(--on,0)*100%),var(--anatomy-shade-2))}
.mt-coil .iso-shade[data-shade="3"]{fill:color-mix(in srgb,var(--mt-on-3) calc(var(--on,0)*100%),var(--anatomy-shade-3))}
.mt-coil .iso-top{fill:color-mix(in srgb,var(--mt-on-top) calc(var(--on,0)*100%),var(--anatomy-top))}
.mt-coil .iso-edge{stroke:color-mix(in srgb,var(--mt-on-edge) calc(var(--on,0)*100%),var(--anatomy-hi))}
.mt-coil .iso-line[data-tone="lo"]:not(.iso-edge){stroke:color-mix(in srgb,var(--mt-on-edge) calc(var(--on,0)*60%),var(--anatomy-lo))}
.mt-wire .tb-body{fill:color-mix(in srgb,var(--mt-on-2) calc(var(--on,0)*100%),var(--anatomy-shade-2))}
.mt-wire .tb-shine{fill:color-mix(in srgb,var(--mt-on-top) calc(var(--on,0)*100%),var(--anatomy-top))}
.mt-wire .tb-shade{fill:color-mix(in srgb,var(--mt-on-0) calc(var(--on,0)*100%),var(--anatomy-shade-0))}
.mt-wire .iso-edge,.mt-wire .iso-line{stroke:color-mix(in srgb,var(--mt-on-edge) calc(var(--on,0)*100%),var(--anatomy-mid))}

.mt-north{fill:var(--mt-north);mix-blend-mode:var(--mt-north-blend);stroke:none}
.mt-shaft-top{fill:var(--anatomy-top);stroke:var(--anatomy-mid);stroke-width:.5px;vector-effect:non-scaling-stroke}
.mt-pole{font-family:var(--mt-jp);font-size:3.6px;font-weight:700;fill:var(--anatomy-hi)}
.mt-letter{font-family:var(--mt-jp);font-size:3.4px;font-weight:700;fill:var(--anatomy-mid)}
.mt-engrave{fill:var(--anatomy-lo);font-size:3px}

.mt-spark{pointer-events:none}
.mt-spark-glow{fill:var(--mt-spark-glow);filter:blur(1.4px);opacity:.85}
.mt-spark-ray{fill:none;stroke:var(--mt-spark-ray);stroke-width:1px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mt-spark-core{fill:var(--mt-spark-core)}

.mt-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px auto 0;max-width:560px;font-family:var(--mt-jp);font-size:13px;line-height:1.6;color:var(--anatomy-text);word-break:auto-phrase}
.mt-col{border-top:1px solid var(--anatomy-faint);padding-top:8px}
.mt-name{color:var(--anatomy-strong);font-weight:700}
.mt-now{font-variant-numeric:tabular-nums;color:var(--anatomy-strong)}
.mt-now[data-active]{color:var(--mt-on-edge)}
@media (max-width:560px){.mt-panel{font-size:12px;gap:8px 12px}.iso-plate-corner{font-size:10.5px!important}}
.mt-magnet .iso-shade[data-shade="0"]{fill:var(--mt-mag-0)}
.mt-magnet .iso-shade[data-shade="1"]{fill:var(--mt-mag-1)}
.mt-magnet .iso-shade[data-shade="2"]{fill:var(--mt-mag-2)}
.mt-magnet .iso-shade[data-shade="3"]{fill:var(--mt-mag-3)}
.mt-magnet .iso-top{fill:var(--mt-mag-top)}
.mt-carbon .iso-shade,.mt-carbon .iso-top{fill:var(--mt-carbon)}
.mt-carbon .iso-top{fill:var(--mt-carbon-top)}
.iso{--mt-mag-0:#7f97b2;--mt-mag-1:#8fa6bf;--mt-mag-2:#a0b4ca;--mt-mag-3:#b1c3d6;--mt-mag-top:#c9d6e4;--mt-mag-edge:#3e5672;--mt-mag-ink:#25384f;--mt-carbon:#55555a;--mt-carbon-top:#6e6e73}
.iso[data-theme="dark"]{--mt-mag-0:#284462;--mt-mag-1:#2f4e70;--mt-mag-2:#36587e;--mt-mag-3:#3e628b;--mt-mag-top:#4b72a0;--mt-mag-edge:#9cbde0;--mt-mag-ink:#dce8f5;--mt-carbon:#0a0a0a;--mt-carbon-top:#141414}
@media (max-width:560px){.mt-stage{overflow:hidden}.mt-stage>svg{width:116%;margin-left:-8%}}
.mt-magnet .iso-edge{stroke:var(--mt-mag-edge)}
.mt-magnet .iso-crease,.mt-magnet .iso-bevel{stroke:var(--mt-mag-edge);opacity:.6}
.mt-mag-mark{font-family:var(--mt-jp);font-size:3.4px;font-weight:700;fill:var(--mt-mag-ink)}
.mt-magnet+text.mt-pole,.mt-rotor-mag .mt-pole{fill:var(--mt-mag-ink)}
.iso-key:nth-child(2) .iso-swatch path{stroke:var(--mt-mag-edge)}

</div><span class="mt-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>いま電気が流れているコイルと線</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磁石（左は缶の内側、右は回転子）</span></span><span class="iso-caption">どちらのモーターも、缶の手前を切り取って中を見せています。左のブラシ付きモーターは、回る側（回転子）にコイルがあり、缶の内側に磁石が貼ってあります。電気はブラシと整流子がこすれ合う接点を通ってコイルに入ります。回転子が回るにつれてブラシが触れる整流子の銅片が替わるので、電気が流れるコイルも順に切り替わり、ブラシが銅片から離れる瞬間には小さな火花が出ます。右のブラシレスモーターは内と外が逆で、コイルを外側に固定し、磁石のほうを回します。どのコイルに電気を流すかは、ESCがセンサーで磁石の向きを読みながら電子回路で切り替えるので、こすれて減る接点がありません。中央のつまみは、両方のモーターに送る電気をそろえて強めたり弱めたりします。回転は見やすいようにゆっくりにしています。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {

        for (let step = 0; step <= count; step++) {

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)

    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

            if (!run)
                run = [index];
            run.push((index + 1) % count);

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });
        const insetTop = inset.map(([x, y]) => iso([x, y, z + height], projection));
        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,
        outline: outline.join(""),
        crease: crease.join(""),
        top: pathOf(oriented(top), true),
        shades: buckets.map((paths) => paths.join("")),
        bevel,
    };
}
const ringOf = (plan, steps = 8) => roundedPlan(plan, steps);
function slabOf(plan, z, height, projection, steps = 8, bevel = 0) {
    return extrude(ringOf(plan, steps), z, height, projection, { convex: true, bevel });
}
function circleRing(cx, cy, radius, steps = 40) {
    return Array.from({ length: steps }, (_, step) => {

}
function cylinder(cx, cy, radius, z, height, projection, steps = 32, bevel = 0) {
    return extrude(circleRing(cx, cy, radius, steps), z, height, projection, { convex: true, bevel });

const insetPlan = ({ x, y, w, d, r }, by) => ({ x: x + by, y: y + by, w: w - by * 2, d: d - by * 2, r: Math.max(0, r - by) });

}
const planOutline = (plan, z, projection, steps = 8) => onTop(ringOf(plan, steps), z, projection, true);
const lineOnTop = (from, to, z, projection) => onTop([from, to], z, projection);

// 2 台のモーターの「どのコイルに電気が流れるか」を回転子の角度だけから決める純粋なモデル。
// 角度はモーターごとの局所座標（度）。0° が見る人の方向、+90° が画面の右側。
// ビルドとページの両方がこのファイルを使う（ページへはそのまま埋め込む）。

const mod = (a, m) => ((a % m) + m) % m;
const angleGap = (a, b) => Math.abs(mod(a - b + 180, 360) - 180);

// ---- ブラシ付き（3 極の電機子・3 枚の整流子片・2 本のブラシ） ----
// 極 k は回転子角 phi + 120k にある。コイル k は極 k に巻かれ、
// 整流子片 k と k+1 の継ぎ目（コイル k の両端がつながる点）につながる（三角結線）。
// 継ぎ目 k（片 k と片 k+1 のすき間）は極 k と同じ角度にある。
// ブラシは磁石の軸（±90°）に置く。極 k が磁石の正面に来た瞬間にブラシが継ぎ目 k をまたぎ、
// コイル k が短絡される（転流）。
const BRUSHED = {
  poles: 3,
  brushes: [90, -90],
  brushHalf: 9, // ブラシが整流子に触れる幅の半分（度）
  magnets: [90, -90],
};

// あるブラシが触れている整流子片の番号の一覧
function segmentsUnder(phi, brush, half = BRUSHED.brushHalf) {
  const rel = mod(brush - phi, 360);
  const out = [];
  for (let k = 0; k < 3; k++) {
    const centre = k * 120 - 60; // 片 k は (k-1)·120 〜 k·120
    if (angleGap(rel, centre) < 60 + half) out.push(k);
  }
  return out;
}

// 三角結線の 3 つの節点の電位を解き、各コイルの電流の大きさ（最大 1）を返す
function brushedState(phi) {
  const plus = segmentsUnder(phi, BRUSHED.brushes[0]);
  const minus = segmentsUnder(phi, BRUSHED.brushes[1]);
  const v = [null, null, null];
  for (const k of plus) v[k] = 1;
  for (const k of minus) v[k] = 0;
  const free = [0, 1, 2].filter((k) => v[k] === null);
  for (const k of free) {
    const others = [0, 1, 2].filter((j) => j !== k).map((j) => v[j]);
    v[k] = others.every((x) => x !== null) ? (others[0] + others[1]) / 2 : 0.5;
  }
  const current = [0, 1, 2].map((k) => Math.abs(v[k] - v[(k + 1) % 3]));
  const strongest = current.indexOf(Math.max(...current));
  const bridging = [plus.length > 1, minus.length > 1];
  const shorted = current.map((c) => c < 1e-6);
  return { plus, minus, current, strongest, bridging, shorted };
}

// ブラシが片から離れた（接点が切れた）ときに true。火花はここで出る。
function brushBreaks(prev, next) {
  return [0, 1].map((i) => {
    const before = i === 0 ? prev.plus : prev.minus;
    const after = i === 0 ? next.plus : next.minus;
    return before.some((k) => !after.includes(k));
  });
}

// ---- ブラシレス（2 極の磁石回転子・6 個のコイル・3 相 A/B/C・6 ステップ） ----
// 相の軸：A は 120°、B は 240°、C は 0°（120° ずつ）。各相は向かい合う 2 個のコイルを直列につなぐ。
const PHASE_AXIS = { A: 120, B: 240, C: 0 };
const TEETH = [
  { at: 120, phase: "A", sign: 1 },
  { at: 180, phase: "C", sign: -1 },
  { at: 240, phase: "B", sign: 1 },
  { at: 300, phase: "A", sign: -1 },
  { at: 0, phase: "C", sign: 1 },
  { at: 60, phase: "B", sign: -1 },
];
const unit = (a) => [Math.cos((a * Math.PI) / 180), Math.sin((a * Math.PI) / 180)];
// X→Y（X に流し込み Y から出す）でできる磁界の向き = X の軸 − Y の軸
const STEPS = [
  ["A", "B"], ["A", "C"], ["B", "C"], ["B", "A"], ["C", "A"], ["C", "B"],
].map(([from, to]) => {
  const a = unit(PHASE_AXIS[from]);
  const b = unit(PHASE_AXIS[to]);
  const field = mod((Math.atan2(a[1] - b[1], a[0] - b[0]) * 180) / Math.PI, 360);
  return { from, to, field: Math.round(field * 1000) / 1000 };
});

// ESC はホールセンサーで磁石の向き psi（N 極の向き）を知り、
// 磁界が N 極より 60° 超〜120° 先になる組を選ぶ。60° 回るごとに 1 段進む。
function bldcState(psi) {
  let index = 0;
  STEPS.forEach((s, i) => {
    const lead = mod(s.field - psi, 360);
    if (lead > 60 && lead <= 120) index = i;
  });
  const step = STEPS[index];
  const phase = { A: 0, B: 0, C: 0 };
  phase[step.from] = 1;
  phase[step.to] = -1;
  const coils = TEETH.map((t) => Math.abs(phase[t.phase]));
  // ホールセンサー 3 個（0°, 120°, 240°）の出力：N 極側なら 1
  const hall = [0, 120, 240].map((a) => (angleGap(psi, a) < 90 ? 1 : 0));
  return { index, step, phase, coils, hall, lead: mod(step.field - psi, 360) };
}

const label = (step) => `${step.from}→${step.to}`;

// 寸法と、回る部品（回転子・整流子・ピニオン・つまみの指針）の描き方。
// ビルドとページの両方で使う。K はキットの関数一式（extrude, solidSvg など）。

const DIM = {
  R: 30, // 缶の外半径
  WALL: 1.6,
  MZ: 17, // モーター取り付け板の上面
  CAN_H: 52,
  BELL_H: 12,
  CUT: 62, // 缶と内部の切り欠き（見る人の方向から ±62°）
  BELL_CUT: 80, // エンドベルの切り欠き
  // ブラシ付き
  MAG_IN: 24.2,
  MAG_Z: [8, 42],
  STACK_Z: [10, 40],
  SHOE: [19, 23],
  SHOE_HALF: 46,
  HUB: 6.5,
  STEM_HALF: 3.4,
  COIL: [7.5, 19],
  COIL_HALF: 7.2,
  COIL_OVER: 4.5,
  COMM_R: 6,
  COMM_Z: [46, 54],
  SHAFT_R: 1.6,
  // ブラシレス
  YOKE: [21.2, 28.4],
  TIP: [9.6, 11],
  TIP_HALF: 24,
  TOOTH_HALF: 3,
  BCOIL: [11, 21.2],
  BCOIL_HALF: 5.2,
  BCOIL_OVER: 4,
  MAGROT_R: 8.4,
  MAGROT_Z: [8, 46],
  PINION_R: 4.4,
  PINION_Z: [5, 11],
};

function makeParts(K, P, M) {
  const D = Math.PI / 180;
  const A = (P.azimuth ?? 45) * D;
  const V = [Math.cos(A), Math.sin(A)];
  const S = [Math.sin(A), -Math.cos(A)];
  const at = (p) => K.iso(p, P);
  const f2 = (v) => Math.round(v * 100) / 100;

  // 局所極座標：c を中心に、見る人方向から th 度、半径 r の床上の点
  const pol = (c, r, th) => {
    const a = th * D;
    return [c[0] + r * (Math.cos(a) * V[0] + Math.sin(a) * S[0]), c[1] + r * (Math.cos(a) * V[1] + Math.sin(a) * S[1])];
  };
  // th 方向の腕に沿った座標（rr: 半径方向、t: 接線方向）
  const arm = (c, th, rr, t) => {
    const a = th * D;
    const er = [Math.cos(a) * V[0] + Math.sin(a) * S[0], Math.cos(a) * V[1] + Math.sin(a) * S[1]];
    const et = [-Math.sin(a) * V[0] + Math.cos(a) * S[0], -Math.sin(a) * V[1] + Math.cos(a) * S[1]];
    return [c[0] + rr * er[0] + t * et[0], c[1] + rr * er[1] + t * et[1]];
  };
  const arc = (c, r, a0, a1, n) => {
    const out = [];
    const count = Math.max(2, n ?? Math.ceil(Math.abs(a1 - a0) / 4) + 1);
    for (let i = 0; i < count; i++) out.push(pol(c, r, a0 + ((a1 - a0) * i) / (count - 1)));
    return out;
  };
  const arcRing = (c, r0, r1, a0, a1, n) => [...arc(c, r1, a0, a1, n), ...arc(c, r0, a1, a0, n)];
  const sector = (c, r, a0, a1, n) => [c, ...arc(c, r, a0, a1, n)];
  // 腕の座標で角を丸めた長方形
  const roundBox = (c, th, r0, r1, t0, t1, rad = 0, steps = 3) => {
    if (rad <= 0) return [arm(c, th, r0, t0), arm(c, th, r1, t0), arm(c, th, r1, t1), arm(c, th, r0, t1)];
    const pts = [];
    const corners = [
      [r1 - rad, t0 + rad, -90],
      [r1 - rad, t1 - rad, 0],
      [r0 + rad, t1 - rad, 90],
      [r0 + rad, t0 + rad, 180],
    ];
    for (const [cr, ct, start] of corners) {
      for (let i = 0; i <= steps; i++) {
        const a = (start + (90 * i) / steps) * D;
        pts.push(arm(c, th, cr + rad * Math.cos(a), ct + rad * Math.sin(a)));
      }
    }
    return pts;
  };
  const depthOf = (p) => (p[0] * V[0] + p[1] * V[1]);
  // 中心 c から th の向きに引いた線で多角形を切る（keep=+1 で角度の大きい側を残す）
  const clipRay = (ring, c, th, keep = 1) => {
    const a = th * D;
    const et = [-Math.sin(a) * V[0] + Math.cos(a) * S[0], -Math.sin(a) * V[1] + Math.cos(a) * S[1]];
    const side = (p) => keep * ((p[0] - c[0]) * et[0] + (p[1] - c[1]) * et[1]);
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const p = ring[i];
      const q = ring[(i + 1) % ring.length];
      const sp = side(p);
      const sq = side(q);
      if (sp >= 0) out.push(p);
      if ((sp >= 0) !== (sq >= 0)) {
        const t = sp / (sp - sq);
        out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
      }
    }
    return out;
  };
  const centroid = (ring) => [ring.reduce((a, p) => a + p[0], 0) / ring.length, ring.reduce((a, p) => a + p[1], 0) / ring.length];

  const lam = (ring, zs, step = 2.5, tone = "faint") => {
    const lines = [];
    for (let z = zs[0] + step; z < zs[1] - 0.5; z += step) lines.push(K.ringSeam(ring, z, P));
    return lines.join("") ? K.lineSvg(lines.join(""), { tone }) : "";
  };

  // ---- ブラシ付きの回転子（積層鉄心の 3 極・巻線） ----
  function rotor1(phi, levels = [0, 0, 0]) {
    const c = M.c1;
    const z0 = M.z0;
    const zs = [z0 + DIM.STACK_Z[0], z0 + DIM.STACK_Z[1]];
    const pieces = [];
    // 中心の鉄心（ハブと、巻線の内側に出る短い腕）。巻線の下の腕は巻線に隠れるので描かない
    const coreRing = [];
    for (let k = 0; k < 3; k++) {
      const th = phi + k * 120;
      const half = Math.asin(DIM.STEM_HALF / DIM.HUB) / D;
      coreRing.push(arm(c, th, Math.sqrt(DIM.HUB ** 2 - DIM.STEM_HALF ** 2), -DIM.STEM_HALF));
      coreRing.push(arm(c, th, DIM.COIL[0], -DIM.STEM_HALF), arm(c, th, DIM.COIL[0], DIM.STEM_HALF));
      coreRing.push(...arc(c, DIM.HUB, th + half, th + 120 - half, 9));
    }
    pieces.push({ d: 0, svg: K.solidSvg(K.extrude(coreRing, zs[0], zs[1] - zs[0], P, { convex: false }), { tone: "mid" }) });
    for (let k = 0; k < 3; k++) {
      const th = phi + k * 120;
      const cosk = Math.cos(th * D);
      // 極の先（ポールシュー）は巻線の外側で前後に張り出すので、腕の軸で 2 つに分けて順番を決める
      const split = Math.abs(cosk) < 0.55;
      const spans = split ? [[th - DIM.SHOE_HALF, th], [th, th + DIM.SHOE_HALF]] : [[th - DIM.SHOE_HALF, th + DIM.SHOE_HALF]];
      const halves = spans.map(([a0, a1]) => {
        const ring = arcRing(c, DIM.SHOE[0], DIM.SHOE[1], a0, a1, 12);
        return { ring, d: Math.cos(((a0 + a1) / 2) * D) * 21 };
      });
      const front = halves.length === 1 || halves[0].d > halves[1].d ? 0 : 1;
      halves.forEach((h, i) => {
        let svg = K.solidSvg(K.extrude(h.ring, zs[0], zs[1] - zs[0], P, { convex: false }), { tone: "mid", inner: lam(h.ring, zs) });
        if (i === front) {
          const lp = pol(c, (DIM.SHOE[0] + DIM.SHOE[1]) / 2, th + (halves.length === 1 ? 0 : i === 0 ? -14 : 14));
          const lq = at([lp[0], lp[1], zs[1]]);
          svg += `<text class="mt-pole" x="${f2(lq[0])}" y="${f2(lq[1] + 1.3)}" text-anchor="middle">${k + 1}</text>`;
        }
        pieces.push({ d: h.d, svg });
      });
      const coil = roundBox(c, th, DIM.COIL[0], DIM.COIL[1], -DIM.COIL_HALF, DIM.COIL_HALF, 2.6, 4);
      const cz = [zs[0] - DIM.COIL_OVER, zs[1] + DIM.COIL_OVER];
      const lv = Math.pow(Math.max(0, Math.min(1, levels[k] || 0)), 1.7);
      const turns = lam(coil, cz, 2.2, "lo");
      const coilSvg = `<g class="mt-coil" style="--on:${lv.toFixed(3)}">${K.solidSvg(K.extrude(coil, cz[0], cz[1] - cz[0], P), { tone: "hi", inner: turns })}</g>`;
      pieces.push({ d: cosk * 13.25 + (cosk >= 0 ? 0.01 : -0.01), svg: coilSvg });
    }
    for (const [z0s, z1s] of [[z0 + 4, zs[0]], [zs[1], z0 + DIM.COMM_Z[0]]]) {
      pieces.push({ d: 0.005, svg: K.solidSvg(K.extrude(K.circleRing(c[0], c[1], DIM.SHAFT_R, 16), z0s, z1s - z0s, P), { tone: "mid" }) });
    }
    pieces.sort((a, b) => a.d - b.d);
    return pieces.map((p) => p.svg).join("");
  }

  // 整流子：3 枚の銅片と 3 本のすき間（すき間は極と同じ角度）
  function comm1(phi) {
    const c = M.c1;
    const z0 = M.z0;
    const zc = [z0 + DIM.COMM_Z[0], z0 + DIM.COMM_Z[1]];
    const r = DIM.COMM_R;

    const slits = [];
    const topSlits = [];
    for (let k = 0; k < 3; k++) {
      const th = phi + k * 120;
      const facing = Math.cos(th * D);
      const p = pol(c, r, th);
      if (facing > 0.04) slits.push(K.pathOf([at([p[0], p[1], zc[0]]), at([p[0], p[1], zc[1]])]));
      const q = pol(c, 3.1, th);
      topSlits.push(K.pathOf([at([q[0], q[1], zc[1]]), at([p[0], p[1], zc[1]])]));
    }
    const core = K.lineSvg(K.pathOf(K.circleRing(c[0], c[1], 3.1, 40).map(([x, y]) => at([x, y, zc[1]])), true), { tone: "lo" });
    const shaftTop = K.solidSvg(K.extrude(K.circleRing(c[0], c[1], DIM.SHAFT_R, 20), zc[1], 0.01, P), { tone: "mid" });
    const inner = K.lineSvg(slits.join(""), { tone: "lo" }) + K.lineSvg(topSlits.join(""), { tone: "lo" }) + core;
    return K.solidSvg(K.extrude(K.circleRing(c[0], c[1], r, 48), zc[0], zc[1] - zc[0], P), { tone: "hi", crease: "lo", inner }) + shaftTop;
  }

  // ブラシレスの磁石回転子：N 極側の半分に色を付け、境目の線を描く
  function magnet2(psi) {
    const c = M.c2;
    const z0 = M.z0;
    const zr = [z0 + DIM.MAGROT_Z[0], z0 + DIM.MAGROT_Z[1]];
    const r = DIM.MAGROT_R;
    const top = arc(c, r, psi - 90, psi + 90, 40).map(([x, y]) => at([x, y, zr[1]]));
    // 側面のうち N 極側で、こちらを向いている部分
    const lo = Math.max(psi - 90, -90);
    const hi = Math.min(psi + 90, 90);
    const side = [];
    const norm = (a) => ((a + 180) % 360 + 360) % 360 - 180;
    let a0 = norm(psi) - 90;
    let a1 = a0 + 180;
    const parts = [];
    for (const off of [-360, 0, 360]) {
      const s0 = Math.max(a0 + off, -90);
      const s1 = Math.min(a1 + off, 90);
      if (s1 - s0 > 0.5) parts.push([s0, s1]);
    }
    for (const [s0, s1] of parts) {
      const upper = arc(c, r, s0, s1, 30).map(([x, y]) => at([x, y, zr[1]]));
      const lower = arc(c, r, s1, s0, 30).map(([x, y]) => at([x, y, zr[0]]));
      side.push(K.pathOf([...upper, ...lower], true));
    }
    const n = pol(c, r, psi);
    const s = pol(c, r, psi + 180);
    const lines = [K.pathOf([at([n[0], n[1], zr[1]]), at([s[0], s[1], zr[1]])])];
    for (const a of [psi + 90, psi - 90]) {
      if (Math.cos(a * D) > 0.03) {
        const p = pol(c, r, a);
        lines.push(K.pathOf([at([p[0], p[1], zr[0]]), at([p[0], p[1], zr[1]])]));
      }
    }
    const shaft = K.pathOf(K.circleRing(c[0], c[1], DIM.SHAFT_R, 20).map(([x, y]) => at([x, y, zr[1]])), true);
    const mark = (a, text) => {
      const p = pol(c, r * 0.55, a);
      const q = at([p[0], p[1], zr[1]]);
      return `<text class="mt-pole" x="${f2(q[0])}" y="${f2(q[1] + 1.4)}" text-anchor="middle">${text}</text>`;
    };
    return `<path class="mt-north" d="${K.pathOf(top, true)}${side.join("")}"/>` + K.lineSvg(lines.join(""), { tone: "hi" }) + `<path class="mt-shaft-top" d="${shaft}"/>` + mark(psi, "N") + mark(psi + 180, "S");
  }

  // ピニオンの歯（見えている側だけ、回転に合わせて動く）
  function pinion(c, phi) {
    const z = [DIM.PINION_Z[0], DIM.PINION_Z[1]];
    const r = DIM.PINION_R;
    const lines = [];
    for (let i = 0; i < 14; i++) {
      const a = phi + (i * 360) / 14;
      const f = Math.cos(a * D);
      if (f < 0.1) continue;
      const p = pol(c, r, a);
      lines.push({ d: K.pathOf([at([p[0], p[1], z[0] + 0.3]), at([p[0], p[1], z[1] - 0.3])]), alpha: Math.min(1, (f - 0.1) / 0.35) });
    }
    return K.fadedSvg(lines, { tone: "lo" });
  }

  // つまみの指針
  function pointer(t) {
    const c = M.knob;
    const a = (-135 + 270 * t) * D;
    const dir = [Math.sin(a), -Math.cos(a)]; // 0 で奥（-y）を向く
    const tip = [c[0] + dir[0] * (M.knobR - 1.6), c[1] + dir[1] * (M.knobR - 1.6)];
    const tail = [c[0] + dir[0] * 1.2, c[1] + dir[1] * 1.2];
    return K.pathOf([at([tail[0], tail[1], M.knobTop]), at([tip[0], tip[1], M.knobTop])]);
  }

  return { pol, arm, arc, arcRing, sector, roundBox, clipRay, centroid, depthOf, lam, rotor1, comm1, magnet2, pinion, pointer, V, S };
}

const DATA = {"P":{"origin":[253.71297650674956,176.69423515376218],"scale":1.4420841812767766,"azimuth":70,"elevation":48},"M":{"c1":[-64,26],"c2":[64,26],"z0":17,"knob":[0,-6],"knobR":8,"knobTop":21.6},"speed":210,"bldcOffset":30};
const P = DATA.P;
const K = { iso, pathOf, extrude, circleRing, solidSvg, lineSvg, dotsSvg, fadedSvg, ringSeam };
const LIVE_PARTS = makeParts(K, P, DATA.M);
const stage = document.querySelector(".mt-stage");
const svgEl = stage.querySelector("svg");
const q = (s) => svgEl.querySelector(s);
const el = {
  rotor: q('[data-part="rotor1"]'),
  comm: q('[data-part="comm1"]'),
  mag: q('[data-part="magnet2"]'),
  p1: q('[data-part="m1-pinion"]'),
  p2: q('[data-part="m2-pinion"]'),
  pointer: q('[data-part="pointer"]'),
  sparks: [...svgEl.querySelectorAll("[data-spark]")],
  coils: [...svgEl.querySelectorAll(".mt-coil[data-tooth]")].map((node) => ({ node, index: TEETH.findIndex((t) => t.at === Number(node.dataset.tooth)) })),
  wires: { A: [], B: [], C: [] },
};
for (const node of svgEl.querySelectorAll("[data-wire]")) el.wires[node.dataset.wire].push(node);
const readout = document.querySelector("[data-readout]");
const leftText = document.querySelector("[data-left]");
const rightText = document.querySelector("[data-right]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const smoothstep = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const flash = (age, rise, fall) => (age <= 0 ? 0 : age < rise ? smoothstep(0, rise, age) : Math.exp(-(age - rise) / fall));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (x, target, dt, up, down) => {
  const tau = target > x ? up : down;
  const next = x + (target - x) * (1 - Math.exp(-dt / tau));
  return Math.abs(next - target) < 1e-3 ? target : next;
};

const state = {
  t: 0.4,
  target: 0.4,
  theta: 8,
  time: 0,
  clock: 0,
  touring: !still.matches,
  lv1: [0, 0, 0],
  lv2: TEETH.map(() => 0),
  wire: { A: 0, B: 0, C: 0 },
  sparkAt: [-9, -9],
  prev: brushedState(8),
  words: "",
};

const WORDS = (t) => (t < 0.02 ? "止まっています" : t < 0.34 ? "ゆっくり" : t < 0.67 ? "ふつう" : "速い");
const NUM = ["1", "2", "3"];
const TOUR = [
  [0.4, 6],
  [0.85, 4.5],
  [0.15, 5.5],
  [0, 2.5],
  [0.6, 4.5],
];
const TOUR_LEN = TOUR.reduce((a, s) => a + s[1], 0);
const tourAt = (clock) => {
  let c = clock % TOUR_LEN;
  for (const [v, d] of TOUR) {
    if (c < d) return v;
    c -= d;
  }
  return 0;
};

function draw(dt, calm) {
  const on = state.t > 0.02 ? 1 : 0;
  const phi = state.theta;
  const st = brushedState(phi);
  const breaks = brushBreaks(state.prev, st);
  breaks.forEach((b, i) => {
    if (b && on && !calm) state.sparkAt[i] = state.time;
  });
  state.prev = st;
  for (let k = 0; k < 3; k++) state.lv1[k] = calm ? st.current[k] * on : ease(state.lv1[k], st.current[k] * on, dt, 0.035, 0.09);
  el.rotor.innerHTML = LIVE_PARTS.rotor1(phi, state.lv1);
  el.comm.innerHTML = LIVE_PARTS.comm1(phi);
  el.p1.innerHTML = LIVE_PARTS.pinion(DATA.M.c1, phi);

  const psi = phi + DATA.bldcOffset;
  const bs = bldcState(psi);
  bs.coils.forEach((c, i) => (state.lv2[i] = calm ? c * on : ease(state.lv2[i], c * on, dt, 0.035, 0.09)));
  for (const { node, index } of el.coils) node.style.setProperty("--on", state.lv2[index].toFixed(3));
  for (const ph of ["A", "B", "C"]) {
    const want = Math.abs(bs.phase[ph]) * on;
    state.wire[ph] = calm ? want : ease(state.wire[ph], want, dt, 0.035, 0.09);
    for (const node of el.wires[ph]) node.style.setProperty("--on", state.wire[ph].toFixed(3));
  }
  el.mag.innerHTML = LIVE_PARTS.magnet2(psi);
  el.p2.innerHTML = LIVE_PARTS.pinion(DATA.M.c2, psi);
  el.pointer.setAttribute("d", LIVE_PARTS.pointer(state.t));
  el.sparks.forEach((node, i) => (node.style.opacity = calm ? "0" : flash(state.time - state.sparkAt[i], 0.025, 0.075).toFixed(3)));

  const words = WORDS(state.t);
  const text = "回転：" + words;
  if (readout.textContent !== text) readout.textContent = text;
  const strong = st.current.map((c, i) => (c > 0.99 ? NUM[i] : null)).filter(Boolean);
  const left = on ? "電気が強く流れるコイル：" + strong.join("と") : "いまは電気が流れていません";
  const right = on ? "電気を流している相：" + label(bs.step) : "いまは電気が流れていません";
  if (leftText.textContent !== left) leftText.textContent = left;
  if (rightText.textContent !== right) rightText.textContent = right;
  if (words !== state.words) {
    state.words = words;
    stage.setAttribute("aria-valuenow", String(Math.round(state.target * 100)));
    stage.setAttribute("aria-valuetext", words === "止まっています" ? "止まっています" : words + "回っています");
  }
}

let frame = 0;
let last = 0;
let visible = false;
let idle = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  state.time += dt;
  if (state.touring && !calm) {
    state.clock += dt;
    state.target = tourAt(state.clock);
  }
  state.t = calm ? state.target : ease(state.t, state.target, dt, 0.6, 0.6);
  if (!calm && !state.frozen) state.theta += state.t * DATA.speed * dt;
  draw(dt, calm);
  const busy = !calm && (state.touring || state.t > 0.001 || state.t !== state.target || state.lv1.some((v) => v > 0.001) || state.time - Math.max(...state.sparkAt) < 0.6);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const steer = (value) => {
  state.touring = false;
  state.frozen = false;
  state.target = clamp(value, 0, 1);
  clearTimeout(idle);
  idle = setTimeout(() => {
    state.touring = !still.matches;
    state.clock = 0;
    run();
  }, 3600);
  run();
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

let press = null;
stage.addEventListener("pointerdown", (event) => {
  press = { x: event.clientX, from: state.target, moved: false, id: event.pointerId };
});
stage.addEventListener("pointermove", (event) => {
  if (!press || press.id !== event.pointerId) return;
  const dx = event.clientX - press.x;
  if (!press.moved && Math.abs(dx) > 4) {
    press.moved = true;
    try {
      stage.setPointerCapture(event.pointerId);
    } catch (error) {}
  }
  if (press.moved) steer(press.from + dx / (svgEl.getBoundingClientRect().width * 0.6));
});
const release = (event) => {
  if (!press) return;
  if (!press.moved && event.type === "pointerup") {
    const levels = [0, 0.35, 0.7, 1];
    const next = levels.find((v) => v > state.target + 0.05);
    steer(next === undefined ? 0 : next);
  }
  press = null;
};
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowUp" || event.key === "ArrowRight") to = state.target + step;
  if (event.key === "ArrowDown" || event.key === "ArrowLeft") to = state.target - step;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (event.key === "Escape") to = state.target;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
stage.addEventListener("focus", () => {
  status.textContent = "回転は" + WORDS(state.t) + "。左は" + leftText.textContent + "、右は" + rightText.textContent;
});

// 検証用：角度とつまみを直接決める（ツアーは止まる）
window.__motor = {
  set(theta, t = state.target) {
    state.touring = false;
    state.frozen = true;
    clearTimeout(idle);
    state.theta = theta;
    state.t = state.target = t;
    state.prev = brushedState(theta);
    draw(1, true);
    run();
    return { left: leftText.textContent, right: rightText.textContent, brushed: brushedState(theta), bldc: bldcState(theta + DATA.bldcOffset) };
  },
  spark(i = 0) {
    state.sparkAt[i] = state.time - 0.025;
    el.sparks[i].style.opacity = "1";
  },
};
draw(1 / 60, true);
</script><p style="max-width:960px;margin:20px auto 32px;padding:0 16px;font:15px/1.7 'BIZ UDPGothic','Noto Sans JP',sans-serif;"><a href="https://blog.ichisouzo-lab.com/entry/2026/08/22/002741" style="color:#1A5276;">← 記事「RS-540からドローンへ――マブチモーターと「ラジコン少年」が見てきた40年」に戻る</a></p>
