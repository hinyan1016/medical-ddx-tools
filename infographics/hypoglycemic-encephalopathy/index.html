<main><header class="hd"><h1>低血糖脳症の画像と予後</h1><p>ブドウ糖で意識が戻らないとき（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="低血糖脳症の画像と予後の要点。要点は、片麻痺でも、まず血糖を測ること、予後は、画像と経過を合わせて考えること。どの血糖からでは、54 mg/dL未満で、脳の症状が出始め、低血糖を繰り返す人は、前触れの症状が出にくい。MRIの所見と経過は、異常なしと内包の小さな病変は回復しやすく、両側の大脳白質は回復が遅れることがあり、広い皮質・線条体は転帰が悪いことが多い。注意は、内包の高信号は脳梗塞に似ることがあること、病変の場所は撮影の時期で変わりうること、低血糖の時間だけで予後を決めないこと。初期対応は、血糖を速やかに正常域まで戻す、チアミンのためにブドウ糖を遅らせない、SU薬と腎機能を確かめ再低下に備える。経過では、遅れて意識が戻る例があり、意識が戻らないときは脳波もとる。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月15日時点の文献に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
