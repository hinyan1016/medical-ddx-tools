<main><header class="hd"><h1>抗てんかん薬の定期検査とモニタリング</h1><p>検査項目は薬ごとに添付文書で確認（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="抗てんかん薬の定期検査とモニタリング。多くの添付文書は「連用中は定期的に」とするだけで具体的な間隔は定めておらず、リスクと併用薬に合わせて調整する。主に確認する検査項目は、採血（肝・腎機能と血球数、バルプロ酸はアンモニアも）、視力検査（カルバマゼピン・フェニトイン）、発疹の観察（ラモトリギン・カルバマゼピン、投与初期は特に）、心電図（ラコサミド、心疾患などのリスクがある患者）、重炭酸イオン・体重・眼科検査（トピラマート）、精神症状の観察（レベチラセタム・ペランパネルなど）。血中濃度測定はてんかん診療ガイドライン2018の分類で、非常に有用がフェニトイン・ラモトリギン、有用がカルバマゼピン・フェノバルビタール・バルプロ酸・ペランパネルなど、限定的または未確定がレベチラセタム・ラコサミド・クロナゼパム。参考域はガイドラインと添付文書で幅が違う。特に注意すべき状況は、カルバマゼピンの重症薬疹（日本人ではHLA-A*3101の保有者が多い）、妊娠で血中濃度が下がることがある（ラモトリギン・レベチラセタム）、併用薬で血中濃度が変わる（酵素誘導薬・バルプロ酸など）。最新の添付文書で確認し、患者さんごとに検査計画を立てる。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/12/24/090816">解説記事を読む</a></p></footer></main>
