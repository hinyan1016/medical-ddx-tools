<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検査オーダーとレセプト病名｜医知創造ラボ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#18354c;font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;line-height:1.8}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:clamp(1.3rem,4vw,2rem)}img{display:block;width:100%;height:auto;background:white}a{color:#165e86}@media(max-width:600px){main{padding:12px}}</style></head><body><main><h1>検査オーダーとレセプト病名</h1><p>脳神経内科外来で検査を出すときの流れと確認点を1枚にまとめた図です。点数と算定要件は記事本文の表で確かめてください。</p><a href="infographic.png" target="_blank" rel="noopener noreferrer"><img src="infographic.png" alt="検査オーダーとレセプト病名の全体像。診察で疑い、検査が必要な理由を診療録に残してから傷病名とレセプトへつなぐ流れ、実態と違う病名は使わないこと、疑い病名の整理、脳波・筋電図・自己抗体・髄液・画像の算定要件の確認、症状詳記で補う内容、抗MOG抗体と髄液14-3-3蛋白は今回の原典で項目名を確認できなかったことを示す図"></a><p><a href="infographic.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a> ｜ <a href="https://blog.ichisouzo-lab.com/entry/2025/04/11/042914">記事へ戻る</a></p></main></body></html>
