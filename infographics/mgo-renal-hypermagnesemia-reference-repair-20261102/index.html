<h1>腎不全患者における酸化マグネシウム投与と高マグネシウム血症</h1>
<p>記事全体の要点をまとめた図解です。数値・対象・限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/11/04/195951">解説記事</a>の本文と参考文献をご確認ください。</p>
