<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニキビ（尋常性ざ瘡）の治療｜医知創造ラボ</title><meta name="description" content="ニキビができるまで、急性炎症期と維持期の治療、日常生活でできること、海外の治療との違いを1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>ニキビ（尋常性ざ瘡）の治療</h1></header><p>ニキビができるまで、急性炎症期と維持期の治療、日常生活でできること、海外の治療との違いを1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="ニキビ（尋常性ざ瘡）の治療の全体図。毛穴が詰まり（面皰）、皮脂がたまり、アクネ菌が増えて炎症になる。治療は2つの時期で考える。急性炎症期は塗り薬を組み合わせて炎症を抑え、中等症以上は内服抗菌薬を加え、内服抗菌薬は3か月までが目安。維持期はアダパレンや過酸化ベンゾイルを続け、耐性菌の心配がない薬で再発を防ぐ。日常生活では、洗顔は1日2回、低刺激の保湿剤・化粧品を選ぶ、紫外線を浴びすぎない、偏らずに食べる（特定の食品を一律に制限しない）。海外の治療との違いとして、イソトレチノイン内服は国内ではニキビに未承認、スピロノラクトンは国内のガイドラインが推奨していない。自己判断でやめず、皮膚科で相談しながら続ける。"></a><section><h2>出典と注意</h2><p>日本皮膚科学会 尋常性痤瘡・酒皶治療ガイドライン2023ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/08/22/210542">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
