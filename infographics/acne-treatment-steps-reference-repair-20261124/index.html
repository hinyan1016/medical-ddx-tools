<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニキビ治療の段階的アプローチ｜医知創造ラボ</title><meta name="description" content="ニキビの重症度の決め方と、重症度に合わせた治療の組み合わせ、維持療法、国内のガイドラインで勧められていない治療を1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>ニキビ治療の段階的アプローチ</h1></header><p>ニキビの重症度の決め方と、重症度に合わせた治療の組み合わせ、維持療法、国内のガイドラインで勧められていない治療を1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="ニキビ治療の段階的アプローチの図。重症度は片側の顔の赤ニキビの数で決め、軽症は5個以下、中等症は6〜20個、重症は21〜50個、最重症は51個以上。軽症は塗り薬（アダパレン、過酸化ベンゾイル〔BPO〕）から始める。中等症以上は、作用の違う塗り薬を組み合わせた配合剤（アダパレン＋BPO、クリンダマイシン＋BPO）を使い、内服抗菌薬（ドキシサイクリン・ミノサイクリンなど）を加える。内服は3か月までで、6〜8週目に見直す。外用抗菌薬は赤ニキビに使うが、単独で長く使わない。強い炎症のしこり（嚢腫）にはステロイドの局所注射。よくなったら維持療法へ移り、アダパレン・BPO・その配合剤を続け、耐性菌の心配がない薬を選ぶ。国内のガイドラインで勧められていない治療は、イソトレチノイン内服（ニキビには国内未承認）、スピロノラクトン内服（保険適用外）、レーザー・光線療法（保険適用外）。"></a><section><h2>出典と注意</h2><p>日本皮膚科学会 尋常性痤瘡・酒皶治療ガイドライン2023、各薬の電子添文ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/08/22/210542">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
