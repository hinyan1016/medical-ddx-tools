<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肺癌治療 この20年の変遷｜医知創造ラボ</title><meta name="description" content="肺癌治療この20年の変遷を、診断・手術・放射線治療・薬物療法・多職種での方針決定・これからの課題に分けて1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>肺癌治療 この20年の変遷</h1></header><p>肺癌治療この20年の変遷を、診断・手術・放射線治療・薬物療法・多職種での方針決定・これからの課題に分けて1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="肺癌治療この20年の変遷の図。組織型と病期で決める治療から、遺伝子変化や免疫の目印も調べて選ぶ治療へ移った。診断では低線量CT検診、遺伝子パネル検査・リキッドバイオプシー、手術では胸腔鏡・ロボット支援手術、小さな肺癌には区域切除、手術の前後に薬を組み合わせる周術期治療。放射線治療では定位放射線治療と粒子線治療（陽子線・重粒子線）、薬物療法では遺伝子変化に合わせた分子標的薬と免疫チェックポイント阻害薬。多職種で本人の希望も材料に方針を決め、副作用対策と早期からの緩和ケアで生活の質を支える。これからの課題は薬剤耐性、早期発見、小細胞肺癌、医療へのアクセス。"></a><section><h2>出典と注意</h2><p>日本肺癌学会『肺癌診療ガイドライン』、主要な臨床試験ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/05/18/190149">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
