<main><header class="hd"><h1>ベンゾジアゼピン離脱症状とその対策</h1><p>医療従事者向けガイド</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="ベンゾジアゼピン離脱症状とその対策。長く使った後の減量・中止で、不安・不眠・振戦・発汗などが起こり、急な中止ではけいれん発作やせん妄も起こりうる。症状は短時間作用型で中止後2日以内、長時間作用型で4〜7日以内に出て、長期使用者では数か月続くこともある。米国の共同ガイドライン（2025）は急に中止せず、はじめは2〜4週ごとに5〜10%ずつ、2週間で25%を超えない目安で減らし、身体依存が強い人はさらにゆっくりを検討し、強い症状が出たら減量を遅らせるか止めるとしている。発作リスクがある人は減量をより遅くすることを検討し、発作時の対応を前もって決め、入院下の減薬も検討する。高齢者は続ける強い理由がなければ多くの人で漸減を勧め、転倒やせん妄に注意する。減薬はCBTや睡眠衛生で支え、補助薬の根拠は限られ、計画を患者と共有し、数か月から数年かかることもある。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2026/02/03/011211">解説記事を読む</a></p></footer></main>
