<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脳梗塞診療の20年を振り返る：tPAから血管内治療、そして個別化医療の未来へ｜図解</title><style>body{margin:0;background:#f1f6fa;color:#17364d;font-family:Meiryo,sans-serif;line-height:1.8}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:1.6rem}figure{margin:28px 0;padding:16px;background:white;border-radius:12px}img{display:block;max-width:100%;height:auto;margin:auto}figcaption{margin:12px 0}a{color:#075a93}footer{padding:18px;border-top:1px solid #ccd}</style></head><body><main><h1>脳梗塞診療の20年を振り返る：tPAから血管内治療、そして個別化医療の未来へ</h1><p>2025年の記事執筆時点までの主要文献に基づく図解です。数値・対象・限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/07/06/130255">解説記事</a>の参考文献と本文をご確認ください。</p><figure id="figure-1"><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20261022/20261022231002.png" target="_blank" rel="noopener"><img src="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20261022/20261022231002.png" alt="脳梗塞診療の20年。静注療法・画像・血栓回収・二次予防・研究段階の治療を、適応条件と限界とともに示す概要図。"></a><figcaption>脳梗塞診療の20年。静注療法・画像・血栓回収・二次予防・研究段階の治療を、適応条件と限界とともに示す概要図。</figcaption><p><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20261022/20261022231002.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure><figure id="figure-2"><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20250706/20250706130123.png" target="_blank" rel="noopener"><img src="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20250706/20250706130123.png" alt="「脳梗塞診療の20年の進歩」と題したインフォグラフィック。左側に血管を示す脳のシルエット、中央のタイムライン矢印に2005・2015・2025の年号と、tPA注射器・ステントリトリーバー・AIチップ／DNAアイコンを配置し、治療の進化を青と黄金の配色で表現している。"></a><figcaption>「脳梗塞診療の20年の進歩」と題したインフォグラフィック。左側に血管を示す脳のシルエット、中央のタイムライン矢印に2005・2015・2025の年号と、tPA注射器・ステントリトリーバー・AIチップ／DNAアイコンを配置し、治療の進化を青と黄金の配色で表現している。 AI・DNAのアイコンは将来研究の概念であり、遺伝子に基づく個別治療の確立を示しません。</figcaption><p><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20250706/20250706130123.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure><figure id="figure-3"><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20260531/20260531225757.png" target="_blank" rel="noopener"><img src="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20260531/20260531225757.png" alt="脳梗塞治療 20年の進歩タイムライン ― 第一段階：t-PA静注（血栓溶解療法）の時代、第二段階：血管内治療（血栓回収術）がエビデンスとして確立、第三段階：時間枠の拡大・画像による個別化医療へ"></a><figcaption>脳梗塞治療 20年の進歩タイムライン ― 第一段階：t-PA静注（血栓溶解療法）の時代、第二段階：血管内治療（血栓回収術）がエビデンスとして確立、第三段階：時間枠の拡大・画像による個別化医療へ</figcaption><p><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20260531/20260531225757.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure><figure id="figure-4"><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20261022/20261022231012.png" target="_blank" rel="noopener"><img src="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20261022/20261022231012.png" alt="血栓閉塞、カテーテル到達、血栓回収の概念図。再開通しても機能回復を保証しない。"></a><figcaption>血栓閉塞、カテーテル到達、血栓回収の概念図。再開通しても機能回復を保証しない。</figcaption><p><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/h/hinyan1016/20261022/20261022231012.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure><footer><p>図は説明のための概念図です。個別の診療判断や手技の指示を目的としません。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/07/06/130255">解説記事へ戻る</a></p></footer></main></body></html>
