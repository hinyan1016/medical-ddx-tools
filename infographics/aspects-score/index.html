<section id="overview">
  <h2>全体要約：ASPECTS</h2>
  <a href="overview.png" target="_blank" rel="noopener noreferrer" title="原寸の画像を開く">
    <img src="overview.png" alt="ASPECTSの要点をまとめた図。医師が読影用モニターを見る場面から、基底核レベルのC・L・IC・I・M1・M2・M3と、その上のレベルのM4・M5・M6の10領域をタイルで示し、変化のある領域ごとに1点を引く10点満点のスコアであることを表す。6点以上は血栓回収が勧められる、3〜5点は妥当、3点未満はDWIで発症6.5時間以内なら考慮、という国内指針の区分を色帯で示し、閉塞部位・時間・重症度とあわせて判断すること、DWIはCTより約1点低く出る傾向があること、後方循環はpc-ASPECTSを使うこと、点数だけで適応は決まらず、rt-PAの『広汎』に決まった点数はないことを添えている" width="1086" height="1448">
  </a>
