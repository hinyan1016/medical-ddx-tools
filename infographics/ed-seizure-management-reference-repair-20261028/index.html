<h1>救急外来でのてんかん発作対応</h1>
<p>記事全体の要点をまとめた図解です。薬の用量・時間の目安・運転の基準などは<a href="https://blog.ichisouzo-lab.com/entry/2025/11/12/074125">解説記事</a>の本文と参考文献をご確認ください。</p>
<figure id="figure-1">
<a href="infographic.png" target="_blank" rel="noopener"><img src="infographic.png" alt="救急外来でのてんかん発作対応のインフォグラフィック（研修医向け・2026年10月時点）。まず命を守る（けいれん＝てんかんではない、脈と呼吸を確かめて心停止・失神を考える、ABCを保つ、すぐに血糖を測る、口の中に物を入れない、応援を呼ぶ）、5分以上続けば段階的に薬で止める（第一段階はベンゾジアゼピン系薬の静注、止まらなければ第二段階で抗てんかん薬の静注を追加、さらに止まらなければ第三段階で気管挿管・人工呼吸と脳波モニタリングのもとで全身麻酔療法）、止めながら原因を探す（初回の発作やいつもと違う発作は原因を調べる。血糖・電解質、頭部画像、心電図、発熱・髄膜刺激徴候があれば髄液検査、抗てんかん薬の飲み忘れ・中断、飲酒・睡眠不足などの誘因）、紛らわしいものを見分ける（失神、PNES、舌の側面の咬傷、麻痺が残るときの脳卒中、目撃者の話と動画。尿失禁は鑑別に役立たず、単独の所見で決めない）、帰る前に伝える（5分以上続けば救急車、睡眠不足・飲酒・入浴・高所に注意、抗てんかん薬を自己判断でやめない、運転は診断と見通しが決まるまで控えて再開は主治医と相談、専門医へ紹介）を示す" width="1024" height="1536"></a>
<figcaption>救急外来でのてんかん発作対応：まず命を守る、5分以上続けば段階的に薬で止める、止めながら原因を探す、紛らわしいものを見分ける、帰る前に伝える（研修医向け・2026年10月時点）</figcaption>
