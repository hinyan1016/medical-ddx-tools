<h1>過不足のない症状詳記</h1>
<p>記事全体の要点をまとめた図解と、<a href="https://tools.ichisouzo-lab.com/shojo_shoki_helper.html">症状詳記 作成補助ツール</a>の画面例（架空の入力例）です。詳しい説明と限界は解説記事の本文をご確認ください。</p>
<figure id="figure-1"><a href="infographic.png" target="_blank" rel="noopener"><img src="infographic.png" alt="診療録の事実を、診断・重症度の根拠、検査・治療・管理の理由、量・期間・回数の理由と経過という3つの問いで選び、下書きと過不足チェック、必要に応じたAIの補助を経て、担当医が診療録と照合し提出する流れ。足りない・多すぎる・ちょうどよい文章を対比している。" width="1024" height="1536"></a><figcaption>診療録の事実と理由をつなぎ、過不足を見直します。3つの問いは作者による整理で、AIは任意の補助です。診療録にない事実は書かず、最後は担当医が照合して提出する文章を確定します。</figcaption><p><a href="infographic.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure>
<h2>作成補助ツールの画面例（架空の入力例）</h2>
<figure id="figure-2"><a href="tool-template-input.png" target="_blank" rel="noopener"><img src="tool-template-input.png" alt="脳梗塞の架空入力例で片麻痺・構音障害とMRI所見を選んだツール画面" width="1324" height="2250"></a><figcaption>ひな型を選び、診療録にある事実だけを入力・選択します。</figcaption><p><a href="tool-template-input.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure>
<figure id="figure-3"><a href="tool-draft-review.png" target="_blank" rel="noopener"><img src="tool-draft-review.png" alt="架空設定にある追加診察の理由を記した下書きと、量・期間等が未入力の問い3に要補足と表示する画面" width="1546" height="2312"></a><figcaption>下書きは3つの問いで組み立てられ、過不足チェックが見直す場所を示します。</figcaption><p><a href="tool-draft-review.png" target="_blank" rel="noopener">画像を原寸で開く</a></p></figure>
