<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18354c"><title>パーキンソン病のCOMT阻害薬｜図解</title><style>*{box-sizing:border-box}body{margin:0;background:#eff4f7;color:#18354c;font:16px/1.8 Arial,"Yu Gothic",sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(23px,4vw,34px);line-height:1.4}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}nav a,button{border:1px solid #2877a7;border-radius:8px;padding:10px 16px;background:white;color:#18354c;font:inherit;text-decoration:none;cursor:pointer}section{background:white;border-radius:14px;padding:20px;margin:24px 0;scroll-margin-top:20px}img{width:100%;height:auto;display:block;cursor:zoom-in}figure{margin:0}figcaption{font-size:14px;margin-top:16px}dialog{border:0;padding:18px;width:96vw;max-width:none;height:94vh;overflow:auto}dialog::backdrop{background:#152c48e6}dialog img{width:1672px;max-width:none;cursor:default}dialog button{position:sticky;top:0;float:right;z-index:2}footer{font-size:14px;padding:20px 0}@media(max-width:600px){main{padding:15px}section{padding:12px}}</style></head><body><main><h1>パーキンソン病のCOMT阻害薬</h1><p>全体像、作用機序、レボドパの曝露と副作用を図で確認できます。画像を押すと拡大し、小さな画面では横に動かして読めます。</p><nav aria-label="図の目次"><a href="#overview">全体像</a><a href="#mechanism">作用機序</a><a href="#exposure">曝露と副作用</a></nav><section id="overview"><h2>COMT阻害薬の全体像</h2><figure><img tabindex="0" src="overview.png" alt="国内2剤の服用法、末梢での代謝抑制、効果と副作用の調整をまとめた概略図。" data-zoom="overview.png"><figcaption>国内電子添文および臨床試験に基づく画像生成図。</figcaption></figure></section><section id="mechanism"><h2>作用機序</h2><figure><img tabindex="0" src="mechanism.png" alt="末梢COMTとDDCの別経路、レボドパの血液脳関門通過と脳内変換。" data-zoom="mechanism.png"><figcaption>小野薬品工業 オンジェンティスIF 2026年10月第6版、本文p.68の模式図を参考に画像生成で再構成。エンタカポンの位置はコムタン電子添文18.1でも照合。チロシン合成・再取り込みは省略。</figcaption></figure></section><section id="exposure"><h2>レボドパの曝露と副作用</h2><figure><img tabindex="0" src="exposure.png" alt="レボドパの曝露量が増え、消失が緩やかになる定性的な概念図。" data-zoom="exposure.png"><figcaption>コムタン電子添文2026年7月第4版p.3のレボドパ濃度図を参考に画像生成で再構成。実測値・治療域・効果量を示す図ではない。薬剤や患者で変化は異なる。</figcaption></figure></section><footer>原図の画像そのものの転載ではなく、医学的な経路や関係を画像生成で再構成しています。<br><a href="https://www.info.pmda.go.jp/go/interview/1/180188_1169019F1024_1_006_1F.pdf">オンジェンティスIF</a> ／ <a href="https://www.pmda.go.jp/PmdaSearch/iyakuDetail/ResultDataSetPDF/181764_1169014F1021_2_02">コムタン電子添文</a><p>監修：脳神経内科医 今村久司。個々の治療方針は、担当の先生の判断によります。</p></footer></main><dialog aria-label="図の拡大表示"><button type="button">閉じる</button><img alt="拡大した図"></dialog><script>(function(){var dlg=document.querySelector('dialog');var imgs=document.querySelectorAll('[data-zoom]');function show(e){dlg.querySelector('img').src=e.getAttribute('data-zoom');dlg.showModal();}for(var i=0;i<imgs.length;i++){imgs[i].addEventListener('click',function(){show(this)});imgs[i].addEventListener('keydown',function(e){if(e.key==='Enter'){show(this)}})}dlg.querySelector('button').addEventListener('click',function(){dlg.close()})})();</script></body></html>
