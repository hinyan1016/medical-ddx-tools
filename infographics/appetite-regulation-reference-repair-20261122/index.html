<h1>食欲を調節するしくみ</h1>
<p><a href="https://blog.ichisouzo-lab.com/entry/2025/03/13/224542">解説記事へ戻る</a></p>
<figure id="figure-1"><a href="1.png" target="_blank" rel="noopener noreferrer"><img src="1.png" width="896" height="1344" loading="lazy" alt="食前の胃、食後の腸、蓄えたエネルギー、食べ物の見た目や香りの信号が脳に集まり、食べる行動の調節に関わる図"></a><figcaption>食前と食後のホルモン、体に蓄えたエネルギー、食べ物の見た目や香りが、脳を通じて食欲に関わります。</figcaption><p><a href="1.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p><details><summary>図の文章を読む（クリック／タップで開閉）</summary><ul><li>体の信号と食べ物の刺激が脳を通じて食欲に関わる。</li><li>食前の胃から出るグレリンは、食べ始めることに関わる。</li><li>食後の腸から出るホルモンは、満腹感に関わる。</li><li>レプチンは、体に蓄えたエネルギーを脳に伝える。</li><li>食べ物の見た目や香りも、食べたい気持ちに関わる。</li><li>脳の回路が食べる行動を調節する。</li><li>空腹感・食べた量・体重は別々に見る。動物の実験結果をそのままヒトに当てはめない。</li></ul></details></figure>
<figure id="figure-2"><a href="2.png" target="_blank" rel="noopener noreferrer"><img src="2.png" width="720" height="480" loading="lazy" alt="パン屋の前で、店先に並ぶパンに視線を向ける人"></a><figcaption>店先のパンが気になることと、実際に食べた量は、別々に考えます。</figcaption><p><a href="2.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p></figure>
<figure id="figure-3"><a href="3.png" target="_blank" rel="noopener noreferrer"><img src="3.png" width="720" height="480" loading="lazy" alt="食事と時刻を記したノートを診察で医師に見せる人"></a><figcaption>食欲が変わった時期や、どんな場面で食事がとりにくかったかをメモにすると、診察で伝えやすくなります。</figcaption><p><a href="3.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p></figure>
