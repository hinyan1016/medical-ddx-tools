<main><header class="hd"><h1>50歳からの帯状疱疹予防</h1><p>シングリックスとビケンの違い</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="50歳からの帯状疱疹予防。帯状疱疹は50歳代から増えて70歳代で最も多く、治った後も痛みが残ることがある。シングリックスはウイルスの成分を使い筋肉内に2回、ビケンは弱めた生きたウイルスで皮下に1回接種する。厚生労働省のまとめによる予防効果の目安は、シングリックスが1年で9割以上、5年で9割程度、10年で7割程度、ビケンが1年で6割程度、5年で4割程度。副反応はシングリックスで注射部位の痛みや全身の症状が出やすく、ビケンは主に注射部位の赤みやかゆみ。シングリックスは免疫が低下していても受けられるが、ビケンは免疫が低下している人や妊娠中の人は受けられない。2025年度から定期接種となり、65歳を迎える方などがどちらか1種類を受ける。費用や実施期間は市区町村に確認し、医師と相談して選ぶ。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/11/14/193519">解説記事を読む</a></p></footer></main>
