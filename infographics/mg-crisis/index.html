<main><header class="hd"><h1>重症筋無力症クリーゼ</h1><p>ガイドラインに基づく診断と治療（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="重症筋無力症クリーゼの全体像。クリーゼは呼吸不全で人工呼吸が必要な状態で、誘因は感染が最多だが不明のこともある。初期対応はICUで呼吸を監視し、悪化に関与しうる薬を見直し、抗コリンエステラーゼ薬は中止を考える。呼吸管理では高二酸化炭素血症が進む前にNIVを試み、球麻痺では誤嚥に注意する。挿管の目安は日本のガイドラインで肺活量15 mL/kg以下で、予定した挿管が望ましい。抜管は筋力と嚥下の回復後。急性期の免疫治療は血漿浄化療法とIVIGを併存症で選び、MuSK抗体陽性では血漿浄化療法、ステロイド併用は初期増悪に注意する。再発予防は維持免疫療法、胸腺病変への対応、感染予防と薬の確認、新しい分子標的薬は国内の適用条件がある。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/12/08/051011">解説記事を読む</a></p></footer></main>
