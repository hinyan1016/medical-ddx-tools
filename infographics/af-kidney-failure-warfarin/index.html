<main><header class="hd"><h1>腎不全でDOACが使えないとき、ワルファリンを安易に使わない方が良いか</h1><p>維持透析では、安易に使わない勧め方は間違っていない（医療者向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="腎不全でDOACが使えないとき、ワルファリンを安易に使わない方が良いか。判定は、維持透析では安易に使わない勧め方は間違っていない。3つの理由は、出血が増える（出血・大出血のハザード比1.30〜1.47）、脳梗塞・血栓塞栓の有意な減少は示されていない、INR管理が難しい（INRが目標域にいた時間44〜58%）。腎機能別の整理は、維持透析はDOAC禁忌でワルファリンは推奨されない（指針クラスIII）、非透析でCCr 15〜30はDOACが使える（ダビガトラン以外）、非透析でCCr 15未満はDOAC禁忌でワルファリンは弱い推奨（IIb）。使わない方が優れると無作為化試験で確かめられたわけではない。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月7日時点の論文と日本の指針（日本循環器学会／日本不整脈心電学会 2024年フォーカスアップデート版）に基づきます。図はAI画像生成を用いて制作し、数値と文言を根拠資料と照合しています。個別の診療判断に代わるものではありません。</p><p id="article-link"><a href="https://blog.ichisouzo-lab.com/entry/2026/10/07/104914">詳しい解説・参考文献を読む（ブログ）</a></p></footer></main>
