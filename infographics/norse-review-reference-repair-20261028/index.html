<p>記事全体の要点をまとめた図解です。数値の対象、薬の承認の範囲、根拠の限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/09/14/070616">解説記事</a>の本文と参考文献をご確認ください。</p>
