<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多発性硬化症（MS）治療の20年｜医知創造ラボ</title><meta name="description" content="多発性硬化症（MS）治療の20年を、国内で使える再発予防の薬、診断の進歩、治療目標NEDA、開業医の役割とあわせて1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>多発性硬化症（MS）治療の20年</h1></header><p>多発性硬化症（MS）治療の20年を、国内で使える再発予防の薬、診断の進歩、治療目標NEDA、開業医の役割とあわせて1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="多発性硬化症（MS）治療の20年をまとめた図。国内で使える再発予防の薬は2000年の1種類から2026年11月には9種類に増え、注射薬（インターフェロンβ・グラチラマー酢酸塩）、経口薬（フィンゴリモド・フマル酸ジメチル・シポニモド・ジロキシメルフマラート）、抗体薬（ナタリズマブ・オファツムマブ）に分かれる。オクレリズマブとテリフルノミドは国内ではMSに未承認で、一次性進行型MSに有効性を示した薬も国内では未承認。マクドナルド基準の改訂で早く診断できるようになり、NMOSDとMOGADは抗体で区別される別の病気になった。治療目標のNEDAは、再発がない、障害の進行がない、MRIで新しい病変がない状態。開業医はくり返す神経症状からMSを疑って速やかに神経内科へ紹介し、急な視力低下や歩けないほどの脱力では急いで紹介する。"></a><section><h2>出典と注意</h2><p>日本神経学会 多発性硬化症・視神経脊髄炎スペクトラム障害診療ガイドライン2023、PMDA新医薬品の承認品目一覧ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/05/17/070332">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
