<h1>蘇生後の脳機能予後評価：2026年10月改訂図</h1>
<div class="links"><a href="https://blog.ichisouzo-lab.com/entry/2025/08/18/204551#prognosis-infographic">解説記事へ</a><a href="../../post_cardiac_arrest_prognosis.html">予後判定支援ツールへ</a><a href="infographic.png" target="_blank" rel="noopener noreferrer">画像の原寸を開く</a></div>
<p class="notice">図の「正常体温・鎮静中止から72時間以上」は、AHA 2025の<strong>検査結果を統合する評価時期</strong>の目安です。すべての検査をこの時期まで待つという意味ではありません。薬剤・体温・全身状態などの影響を除く必要があり、検査ごとの採用時期とERC/NCSとの違いは解説記事で確認してください。単独の所見や時間経過だけで回復不能を確定しません。</p>
<figure class="figure"><img src="infographic.png" alt="成人の非外傷性心停止後の神経学的予後評価。時期と交絡因子を確認し、神経所見・脳波・SSEP・血液検査・CTとMRIを統合。不良所見の一致は専門チームで確認し、矛盾や情報不足は保留・再評価、回復を支持する情報は経過観察につなげる。予後評価と治療方針は別に話し合う。" width="1086" height="1448"><figcaption><small>改訂本文の全体像を示す模式図です。個々の検査の閾値や患者個人の回復確率を示すものではありません。</small></figcaption></figure>
