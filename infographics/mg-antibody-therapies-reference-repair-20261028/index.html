<h1>重症筋無力症に対する抗体薬：最新の治療オプションと臨床的意義</h1>
<p>記事全体の要点をまとめた図解です。数値・対象・限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/04/05/044633">解説記事</a>の本文と参考文献をご確認ください。</p>
<figure id="figure-1">
<a href="infographic.png" target="_blank" rel="noopener"><img src="infographic.png" alt="重症筋無力症に対する抗体薬のインフォグラフィック。上段はAChR抗体の例で、B細胞がつくる自己抗体（IgG）が神経筋接合部のアセチルコリン受容体に結合し、補体が働く様子を示す。中段は抗体薬と関連する薬の3つのグループで、B細胞標的療法（イネビリズマブ、保険適用外のリツキシマブ）は自己抗体をつくるB細胞を減らし、FcRn阻害薬（エフガルチギモド、ロザノリキシズマブ、ニポカリマブ）はFcRnを妨げて自己抗体を含むIgGを減らし、補体阻害薬（エクリズマブ、ラブリズマブ、ペプチド製剤のジルコプラン、ゲフルリマブ。AChR抗体陽性の患者に使う）は補体C5の開裂を妨げて膜侵襲複合体の形成を防ぐ。注意点として、B細胞標的療法ではB型肝炎ウイルスの再活性化や日和見感染、FcRn阻害薬ではIgGの低下による感染症、補体阻害薬では髄膜炎菌感染症と、原則として投与前のワクチン接種を挙げる。FcRn阻害薬と補体阻害薬はプラセボ対照試験で症状の改善を示した。下段は日本での位置づけで、ステロイドまたは免疫抑制薬が十分に奏効しない全身型MGで抗体薬を考慮すること、選ぶときに考える要素（抗体の種類、合併症、投与経路と通院の負担、費用）、直接比較試験がなく使い分けの根拠がまだ十分でないことを示す（2026年10月時点）" width="1024" height="1536"></a>
