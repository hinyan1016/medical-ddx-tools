<h1>ADA糖尿病標準治療 2026</h1>
<p><a href="https://blog.ichisouzo-lab.com/entry/2025/04/24/192218">解説記事へ戻る</a></p>
<figure id="figure-1"><a href="1.png" target="_blank" rel="noopener noreferrer"><img src="1.png" width="944" height="1416" loading="lazy" alt="一般外来で優先課題を決め、血糖測定、薬剤、肝線維化、栄養・体重、低血糖と治療負担を確認する流れ"></a><figcaption>外来で最初に取り組む問題を明らかにし、測定や薬剤、生活支援の計画を本人と相談します。</figcaption><p><a href="1.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p><details><summary>図の文章を読む（クリック／タップで開閉）</summary><ul><li>妊娠していない成人の一般外来。最初に解決したい問題から治療を組み立てる。</li><li>CGMは、測る目的を先に決める。</li><li>2型糖尿病・糖尿病予備群ではFIB-4で肝線維化のリスクを評価し、必要に応じて追加検査へ進む。</li><li>心血管疾患・心不全・腎臓病に応じて薬を選ぶ。</li><li>続けられる食事・体重の目標を本人と決める。</li><li>次の受診で低血糖と治療の負担を振り返る。</li><li>日本での適応・保険は別に確認する。</li></ul></details></figure>
<figure id="figure-2"><a href="2.png" target="_blank" rel="noopener noreferrer"><img src="2.png" width="704" height="469" loading="lazy" alt="外来で測定機器と食事時刻の記録を見比べる医療者と患者"></a><figcaption>次の受診では、低値が出た時刻を優先して確認し、食事・運動・服薬の記録と照らし合わせます。</figcaption><p><a href="2.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p></figure>
<figure id="figure-3"><a href="3.png" target="_blank" rel="noopener noreferrer"><img src="3.png" width="704" height="469" loading="lazy" alt="食事の際に甘い飲料を水に替える例"></a><figcaption>普段の食事から次回までに試せることを選びます。例えば、甘い飲料を水に替える方法があります。</figcaption><p><a href="3.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p></figure>
