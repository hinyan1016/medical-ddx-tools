<main><header class="hd"><h1>BIRDs（発作かもしれない短い律動）</h1><p>ACNS 2021の定義と臨床での使い方</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="BIRDs（発作かもしれない短い律動）のまとめ。4 Hzを超える律動が0.5秒以上10秒未満続き、明らかな症状はない。進展して10秒以上続けば脳波上の発作。確定的BIRDsは進展性ありか既知の棘波・発作と同じ形と場所、可能性のあるBIRDsは鋭い輪郭だけ。ICUでは発作の手がかり、てんかんでは薬剤抵抗性と関連し、BIRDsの場所は発作が始まる場所とほぼ一致。ウィケット棘波・RMTD・睡眠紡錘波と見分ける。持続脳波を少なくとも24時間続け、発作がないか確かめ、確定的BIRDsは治療を検討。治療は専門家の推奨で、個々の患者で判断。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月23日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/07/05/072731">解説記事を読む</a></p></footer></main>
