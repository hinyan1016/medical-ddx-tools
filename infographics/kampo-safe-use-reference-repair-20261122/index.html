<h1>はじめての漢方薬</h1>
<p><a href="https://blog.ichisouzo-lab.com/entry/2025/07/08/070708">解説記事へ戻る</a></p>
<figure id="figure-1"><a href="1.png" target="_blank" rel="noopener noreferrer"><img src="1.png" width="944" height="1416" loading="lazy" alt="漢方薬を使う前の製品と試験結果、併用薬の確認と、服用後の記録・受診を示す図"></a><figcaption>漢方薬を使う前に、実際の製品、試験で確かめられた効果、併用中の薬を確認します。</figcaption><p><a href="1.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p><details><summary>図の文章を読む（クリック／タップで開閉）</summary><ul><li>実際の製品・効果の根拠・併用薬を確かめてから使う。</li><li>使う前に製品名を確認する。同じ処方名でも用法は異なり得る。</li><li>承認された効能と比較試験の結果は別々に確かめる。</li><li>市販薬も含めて伝え、生薬の重複を確認する。</li><li>良くなった症状と新しい症状は服用中に別々に記録する。</li><li>小柴胡湯の服用中に咳・発熱・息切れが新たに出たら、服用を中止して速やかに受診する。</li></ul></details></figure>
<figure id="figure-2"><a href="2.png" target="_blank" rel="noopener noreferrer"><img src="2.png" width="704" height="469" loading="lazy" alt="処方薬の袋、市販薬の箱、お薬手帳を薬剤師に出して確認する場面"></a><figcaption>処方薬と市販薬を使うときは、箱やお薬手帳を見せて、生薬が重複していないか薬剤師に確認します。</figcaption><p><a href="2.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p></figure>
<figure id="figure-3"><a href="3.png" target="_blank" rel="noopener noreferrer"><img src="3.png" width="704" height="469" loading="lazy" alt="薬の袋とノートを机に置き、服用後の変化を記録する場面"></a><figcaption>服用を始めた日と、新しい症状が出た日をメモしておくと、診察で経過を伝えやすくなります。</figcaption><p><a href="3.png" target="_blank" rel="noopener noreferrer">画像を原寸で開く</a></p></figure>
