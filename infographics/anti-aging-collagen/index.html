<main><header class="hd"><h1>コラーゲンのサプリで、老化は防げる？</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第13回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="コラーゲンのサプリで、老化は防げるか。判定は、老化予防目的のコラーゲンのサプリは「まだ分からない」。肌の水分は改善、弾力は研究によって分かれる。研究の読み方は、肌の水分は複数の解析で偽薬より改善、試験は小さく期間もさまざま、死亡・認知症・骨折を調べた比較試験は調べた範囲で見つからない。分かっていることは肌の水分の改善と、含まれた試験で副作用の報告がないこと。分かっていないことは弾力の効果、老化を防ぐ効果、長く続けた場合の安全性。注意は、原料によってはアレルギーが起こること、試験の著者に企業の社員がいる例があること。採点は、根拠C・効果小〜不明・安全性高・費用は未確認。やることは、まず紫外線対策を考える、サプリは原料のアレルギーと続けられるかを確認する、体調の変化があれば中止して医師に相談する。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月8日時点の研究に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
