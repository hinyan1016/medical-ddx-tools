<h1>薬疹の救急対応</h1>
<p>記事全体の要点をまとめた図解です。数値・対象・限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/06/25/072020">解説記事</a>の本文と参考文献をご確認ください。</p>
<figure id="figure-1">
<a href="infographic.png" target="_blank" rel="noopener"><img src="infographic.png" alt="薬疹の救急対応で最初に確かめる順番の図解。まず呼吸と循環を確かめてアナフィラキシーを先に考え、疑えば大腿の前外側にアドレナリンを筋注する。次に38℃以上の発熱、目や口唇などの粘膜の症状、膿疱、リンパ節の腫れといった重症薬疹の早期症状を確かめる。いつから何を飲み、いつ発疹が出たかを確かめ、疑わしい薬は中止する。症状が続く・急に悪化するなら入院できる皮膚科へ早急に紹介し、帰宅時は避ける薬を伝え悪化したらすぐ連絡するよう説明する。異常がなくても安全の保証ではなく、抗ヒスタミン薬やステロイドはアドレナリンの代わりにならない" width="1030" height="1526"></a>
<figcaption>薬疹の救急対応：アナフィラキシー、重症薬疹の早期症状、原因薬の確認と中止、帰宅か紹介か</figcaption>
