<main><header class="hd"><h1>成長ホルモンとDHEAで、老化は防げる？</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第15回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="成長ホルモンとDHEAで、老化は防げるか。判定は、健康な人が老化予防のために使う場合、成長ホルモンの注射は「効かない」、DHEAは「まだ分からない」。研究の読み方は、成長ホルモンは体の組成が小さく変わるが筋力の改善は確かめられていない、DHEAは2年の試験で意味のある改善がなかった、死亡・骨折・認知症を見た試験は調べた範囲で見つからない。分かっていることは、成長ホルモンでむくみ・関節痛・血糖の異常が増えたこと、DHEAで骨密度が小さく上がる部位があること。分かっていないことは、長い期間の安全性と、病気や寿命への影響。注意は、がんのある人は成長ホルモンの注射薬を使えないこと、海外の製品の個人輸入には国の確認が必要なこと、米国のFDAは老化予防の使い方を認めていないこと。採点は、成長ホルモンは根拠C・効果小・安全性低・費用は未確認、DHEAは根拠C・効果は小〜不明・安全性中・費用は未確認。やることは、老化予防に成長ホルモンの注射は使わない、DHEAは老化予防の目的で急がない、海外の製品を自己判断で個人輸入しない。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月12日時点の研究に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
