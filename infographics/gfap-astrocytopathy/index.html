<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>GFAPアストロサイトパチー｜全体図・原著MRI｜医知創造ラボ</title><meta content="GFAPアストロサイトパチーの全体図と、CC BYの原著MRI・長期予後の図を原寸で確認できます。" name="description"/><style>body{margin:0;background:#edf2f7;color:#334155;font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;line-height:1.85}main{max-width:1120px;margin:auto;padding:24px;box-sizing:border-box}h1{color:#18354c;font-size:1.7rem}figure{background:white;border-radius:12px;padding:20px!important}img{max-width:100%;height:auto}a{color:#216d9b;overflow-wrap:anywhere}nav{display:flex;flex-wrap:wrap;gap:15px}footer{border-top:1px solid #ccd;margin-top:28px;padding-top:18px}@media(max-width:600px){main{padding:14px}h1{font-size:1.35rem}figure{padding:10px!important}figcaption{font-size:.95em!important}}</style></head><body><main><h1>GFAPアストロサイトパチー：全体図と原著の図</h1><p>画像をクリック／タップすると、元の解像度で表示できます。</p><nav><a href="#figure-1">全体図</a><a href="#figure-2">脳MRI</a><a href="#figure-3">脊髄MRI</a><a href="#figure-4">長期予後</a><a href="#figure-5">脳神経・神経根</a></nav><figure data-claim="S03 S04 S12" id="figure-1" style="margin:28px 0;padding:0;"><a href="article-overview.png" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大（インフォグラフィック）"><img alt="GFAPアストロサイトパチーの症候、髄液検査、MRI、鑑別、免疫治療、治療後の評価をつないだ全体図" height="1448" loading="eager" src="article-overview.png" style="display:block;width:100%;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in;" width="1086"/></a><figcaption style="font-size:.9em;line-height:1.7;color:#475569;margin-top:12px;">症候を把握し、髄液・MRI・鑑別の情報を合わせて治療を判断し、回復後も歩行・認知機能・再発を評価します。AI生成の概念図。診断用画像や手技の実施手順を示すものではありません。<br/><br/><a href="article-overview.png" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大（インフォグラフィック）">画像を原寸で開く</a></figcaption></figure><figure data-claim="S13" id="figure-2" style="margin:28px 0;padding:0;"><a href="mri-brain-zhu2023.jpg" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大"><img alt="抗GFAP抗体陽性患者の脳MRI。脳梁膨大部や両側視床などの異常信号の例" height="1562" loading="lazy" src="mri-brain-zhu2023.jpg" style="display:block;width:100%;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in;" width="2500"/></a><figcaption style="font-size:.9em;line-height:1.7;color:#475569;margin-top:12px;">脳梁膨大部や両側視床などに異常信号を認める例を含む、原著の脳MRI図です。症候と病変分布を対応させて評価します。掲載例の画像であり、この図自体が診断の感度・特異度を示すものではありません。<br/>Zhu B, Sun M, Yang T, et al. Front Immunol. 2023;14:1106490, Figure 2. <a href="https://doi.org/10.3389/fimmu.2023.1106490">原著</a>／<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。画像形式の変換のみ。<br/><a href="mri-brain-zhu2023.jpg" rel="noopener noreferrer" target="_blank">画像を原寸で開く</a></figcaption></figure><figure data-claim="S13" id="figure-3" style="margin:28px 0;padding:0;"><a href="mri-spine-zhu2023.jpg" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大"><img alt="抗GFAP抗体陽性患者の脊髄MRI。長大病変、短節病変、線状病変、円錐部病変の例" height="2036" loading="lazy" src="mri-spine-zhu2023.jpg" style="display:block;width:100%;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in;" width="2500"/></a><figcaption style="font-size:.9em;line-height:1.7;color:#475569;margin-top:12px;">脊髄T2高信号の例。原図のa/bは長い斑状病変、cは複数の短い病変、d/eは長い線状病変、fは円錐部の病変です。症候と病変分布を対応させ、他の脊髄疾患も評価します。<br/>Zhu B, Sun M, Yang T, et al. Front Immunol. 2023;14:1106490, Figure 4. <a href="https://doi.org/10.3389/fimmu.2023.1106490">原著</a>／<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。画像形式の変換のみ。<br/><a href="mri-spine-zhu2023.jpg" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大">画像を原寸で開く</a></figcaption></figure><figure data-claim="S04" id="figure-4" style="margin:28px 0;padding:0;"><a href="outcomes-france2025.png" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大"><img alt="フランスのGFAPアストロサイトパチー研究の生存者におけるmRS分布の経時変化と初診時・最終追跡時の比較" height="603" loading="lazy" src="outcomes-france2025.png" style="display:block;width:100%;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in;" width="2008"/></a><figcaption style="font-size:.9em;line-height:1.7;color:#475569;margin-top:12px;">生存者のmRS分布。Aは経時変化、Bは初診時と最終追跡時の比較です。各時点の評価人数は横軸に記されており、追跡時点によって異なります。自立度の改善と、認知機能などの後遺症の消失は同じ評価ではありません。<br/>Arzalluz-Luque J, Dumez P, Picard G, et al. J Neurol. 2025;272:421, Figure 2. <a href="https://doi.org/10.1007/s00415-025-13159-0">原著</a>／<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。内容変更なし。<br/><a href="outcomes-france2025.png" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大">画像を原寸で開く</a></figcaption></figure><figure data-claim="S07" id="figure-5" style="margin:28px 0;padding:0;"><a href="mri-pns-theuriet2023.jpg" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大"><img alt="髄液GFAP抗体陽性患者のMRI。脳幹軟髄膜、聴神経顔面神経束、脊髄軟髄膜、神経根の造影例" height="1052" loading="lazy" src="mri-pns-theuriet2023.jpg" style="display:block;width:100%;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in;" width="2021"/></a><figcaption style="font-size:.9em;line-height:1.7;color:#475569;margin-top:12px;">中枢・末梢の関与を考える画像例。Aは脳幹軟髄膜と聴神経・顔面神経束、B/Cは脊髄軟髄膜と神経根の造影を示します。局在を考える参考とし、画像だけでは病因を確定できません。<br/>Theuriet J, Cluse F, Gravier-Dumonceau A, et al. J Neurol. 2023;270:5545–5560, Figure 3. <a href="https://doi.org/10.1007/s00415-023-11908-7">原著</a>／<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。内容変更なし。<br/><a href="mri-pns-theuriet2023.jpg" rel="noopener noreferrer" style="cursor:zoom-in;" target="_blank" title="クリックで拡大">画像を原寸で開く</a></figcaption></figure><footer><a href="https://blog.ichisouzo-lab.com/entry/2025/04/16/124624">解説記事へ戻る</a></footer></main></body></html>
