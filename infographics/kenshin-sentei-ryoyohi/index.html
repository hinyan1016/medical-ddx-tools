<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健診後の受診と選定療養費｜図の拡大</title><meta name="description" content="健診の要経過観察と要精密検査、初診時選定療養費の徴収禁止と任意の省略、自院健診から診療を開始する場合の違い。"><style>body{margin:0;background:#f1f5f8;color:#18354c;font-family:Meiryo,sans-serif;line-height:1.8}main{max-width:1122px;width:100%;margin:auto}header,footer{padding:20px}h1{font-size:clamp(21px,4vw,30px);line-height:1.6}section img{display:block;width:100%;height:auto}a{color:#21688f;overflow-wrap:anywhere}footer{background:white}nav{display:flex;flex-wrap:wrap;gap:12px}nav a{padding:8px 14px;border:1px solid #ccdce8;border-radius:8px;background:white;text-decoration:none}</style></head><body><main><header><h1>健診後の受診と選定療養費</h1><p>画像をタップすると原寸で開きます。図の「別の病院で精密検査」は、特定健診・がん検診等の結果による精密検査受診の指示がある場合です。対象となる健診や書類、受診先の規定も確認してください。</p><nav><a href="../">インフォグラフィック一覧</a><a href="overview.png" target="_blank" rel="noopener noreferrer">原寸の画像を開く</a></nav></header><section><a href="overview.png" target="_blank" rel="noopener noreferrer" title="原寸の画像を開く"><img src="overview.png" alt="健診後の受診と選定療養費。要経過観察と要精密検査を区別し、自院健診から診療を始める場合は徴収できないこと、健診結果による精密検査の受診指示は徴収しなくてもよい場合であることを示す図。" width="1122" height="1402"></a></section><footer><p>監修：今村久司（脳神経内科医、脳神経内科・総合内科・てんかんの専門医／指導医）</p><p>出典：厚生労働省 保医発0327第6号（2026年3月27日、同年6月1日適用）第3・17〜18。<a href="https://www.mhlw.go.jp/content/12400000/15-3.pdf">通知原文（PDF23〜24頁）</a>。確認日：2026年10月22日。</p><p><a href="https://blog.ichisouzo-lab.com/">医知創造ラボのブログ</a></p></footer></main></body></html>
