<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>熱中症の危険因子と予防対策｜医知創造ラボ</title><meta name="description" content="熱中症が起こる3つの条件、Ⅰ度からⅣ度までの重症度と対応、特に注意が必要な人、日常でできる予防を1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>熱中症の危険因子と予防対策</h1></header><p>熱中症が起こる3つの条件、Ⅰ度からⅣ度までの重症度と対応、特に注意が必要な人、日常でできる予防を1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="熱中症の危険因子と予防対策の図。暑い環境（高温・多湿・風が弱い・日差しが強い）、からだの状態（高齢・乳幼児・持病・脱水・暑さに不慣れ）、行動（激しい運動・屋外での長時間の作業）の3つの条件が重なると起こり、家の中でも起こる（救急搬送の約4割が住居）。重症度は4段階で、Ⅰ度（めまい・立ちくらみ・こむら返り）は涼しい場所で冷やして水分と塩分をとり、Ⅱ度（頭痛・吐き気・だるさ）はすみやかに医療機関へ、Ⅲ度（意識がおかしい・けいれん）は救急車を呼ぶ。Ⅳ度（深部体温40℃以上で意識障害が強い、2024年のガイドラインで追加）は一刻も早く積極的に冷やす。特に注意が必要なのは高齢者、乳幼児、屋外で働く人、部活動・スポーツをする人、利尿薬・向精神薬などを飲む人。予防として、室温計を見て室温が28℃を超えないように冷房を使い、のどが渇く前から水分と塩分をとり、日差しを避けてゆったりした服を着て、暑さ指数とアラートを確かめる。意識がおかしい、けいれん、自分で飲めないときはすぐ119番に電話し、到着まで体を冷やす。"></a><section><h2>出典と注意</h2><p>日本救急医学会 熱中症診療ガイドライン2024、環境省 熱中症環境保健マニュアル2022ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/08/28/103421">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
