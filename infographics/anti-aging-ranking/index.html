<main><header class="hd"><h1>アンチエイジング18の方法、ランキング発表</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第16回・最終回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="アンチエイジング18の方法のランキング発表。医師の結論は、18の方法のうち「効く」と言えたのは4つで、まず筋トレ・日焼け止め・食事から。順位表は、1位が地中海食（根拠A・効く（条件つき））、2位が筋トレと日焼け止め（根拠B・効く）、4位が処方のトレチノインの塗り薬（根拠B・効く（条件つき））、5位が断食・カロリー制限とビーガン（根拠B・まだ分からない）、7位がコラーゲンのサプリ、8位がDHEAとプラセンタ、10位が幹細胞・エクソソーム、11位がメトホルミン・NMN・ラパマイシン・魚油のサプリ・毎日少量のタダラフィル（いずれも根拠C・まだ分からない）。根拠A・B・Cはヒトでの研究の強さで、同じ根拠のときは効果、安全性の順に並べ、費用・手間は順位に使っていない。順位をつけなかった3つは、老化予防の目的ではおすすめできない方法で、成長ホルモンの注射（根拠C・効かない）、ビタミンDのサプリ（根拠C・効かない（条件つき））、ホルモン補充療法（根拠C・勧められない）。順位の読み方は、順位は規則どおりの機械的な並べ替えで、順位の数字だけでなく判定と安全性も見ること。注意は、「効く」と言えた4つも老化を止める証明ではないこと、病気の治療で使っている薬は自己判断でやめないこと、このチャンネルの物差しによる採点で診療ガイドラインではないこと。やることは、筋トレは週2〜3日で合計週30〜60分、日焼け止めは毎日外に出る前にたっぷり、食事はいまの食事を整える。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は、このシリーズで採点した結果をまとめたもので、新しく論文を調べ直してはいません。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
