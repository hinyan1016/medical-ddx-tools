<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鉄欠乏性貧血の全体像｜医知創造ラボ</title><meta name="description" content="鉄欠乏性貧血のしくみ・原因・症状・検査・治療・食事を1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>鉄欠乏性貧血の全体像</h1></header><p>鉄欠乏性貧血のしくみ・原因・症状・検査・治療・食事を1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="鉄欠乏性貧血の全体像の図。貯蔵鉄が先に減り、最後にヘモグロビンが下がる。原因は食事からの不足、吸収の低下、必要量の増加、慢性的な出血（月経・消化管など）。症状は疲れやすい・息切れ、爪が反り返る（匙状爪）、口角炎・舌炎、氷を無性に食べたくなる、脚がむずむずする。血液検査ではHb・フェリチン・MCVが低下し、男性や閉経後の女性は消化管の検査も行う。治療は経口鉄剤が基本で、フェリチンが戻るまで続け、飲めない・効かないときは静注鉄剤を使い、原因の病気も治療する。食事ではヘム鉄と非ヘム鉄をとり、ビタミンCや肉・魚が吸収を助け、お茶やコーヒーは食事と時間をずらす。自己判断で鉄剤を飲まず、まず医療機関で血液検査を受ける。"></a><section><h2>出典と注意</h2><p>日本鉄バイオサイエンス学会『鉄欠乏性貧血の診療指針』（2024年）、WHO、英国消化器病学会（BSG）ガイドラインほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/05/18/191139">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
