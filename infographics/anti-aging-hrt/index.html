<main><header class="hd"><h1>女性のホルモン補充療法で、老化は防げる？</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第10回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="女性のホルモン補充療法で老化は防げるか。判定は、老化予防目的のホルモン補充療法は「勧められない」。国が認めた使い道（更年期の症状・閉経後骨粗鬆症）とは分けて考える。国が認めた使い道（日本）は、更年期のほてり・発汗、腟の萎縮などの症状と、閉経後骨粗鬆症。老化予防は、承認された使い道にない。研究の読み方は、大規模な比較試験は慢性病の予防を支持しなかった、良い結果は開始時期で分けた解析や非盲検の試験で確実性は高くない、血管の壁の厚みや皮膚の測定値は検査値まで。分かっていることは、ほてりや腟の症状は比較試験で改善が示され、骨折は減った（骨粗鬆症の使い道）。分かっていないことは、老化を結果にしたヒトの比較試験は調べた範囲で見つからない、始める時期で結果が変わるかは確実ではない。害と向かない人は、子宮のある人の併用で乳がん・脳卒中・肺塞栓・冠動脈疾患が増えた、エストロゲン単独で脳卒中が増えた、乳がん・血栓症・脳卒中・冠動脈疾患の既往がある人は使えない。採点は、根拠の強さがC、効果の大きさがなし・不明、安全性が中〜低、費用・手間は出典なし。このチャンネルの物差しで、診療ガイドラインではありません。やること3つは、つらい症状は婦人科・更年期外来で相談、老化予防に自己判断・個人輸入で使わない、使用中の人は自己判断でやめない。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月6日時点の研究と公的資料（医薬品の添付文書・大規模な比較試験とその解析・観察研究）に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p><p><a href="https://tools.ichisouzo-lab.com/slides/anti-aging-hrt/">スライドで見る</a></p></footer></main>
