<main><header class="hd"><h1>2026年ノーベル生理学・医学賞「光遺伝学」</h1><p>光で神経細胞を動かす技術（一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="2026年ノーベル生理学・医学賞は光遺伝学（オプトジェネティクス）。光で神経細胞を動かす技術。受賞者はカール・ダイセロス（アメリカ）、ペーター・ヘーゲマン（ドイツ）、ゲオルク・ナーゲル（ドイツ）。しくみは、藻のたんぱく質「チャネルロドプシン」を神経細胞に入れると光で通り道が開く。青い光でオン（チャネルロドプシン）、黄色い光でオフ（別のたんぱく質）。発見の流れは、緑の藻が0.5ミリ秒で反応、2002年カエルの卵で確認、2005年ラットの神経細胞、2007年マウスの脳へ。分かってきたことは、目覚め・記憶・痛み・食欲・体内時計の回路。主に動物での実験です。医療はどこまで？2021年、網膜色素変性症で失明した1人の患者さんが、特殊なゴーグルをつけたとき、物を見つけて触れられた。治療への最初の一歩。個別の診断や治療に代わるものではありません。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月6日時点のノーベル委員会の公表資料と原論文に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
