<main><header class="hd"><h1>幹細胞・エクソソームで、老化は防げる？</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第12回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="幹細胞・エクソソームで老化は防げるか。判定は、老化予防・美容目的の幹細胞・エクソソームは「まだ分からない」。国が承認した再生医療等製品（特定の病気の治療）とは分けて考える。「届け出」と「承認」は別で、承認は国が効果と安全性を審査して認めること、自費の幹細胞治療は医療機関が国に計画を出すもので効果の保証ではない、エクソソーム・培養上清は学会の指針ではこの法律の審査の外。研究の読み方は、幹細胞の点滴の試験はフレイルの高齢者が対象、肌の試験は小さく短く顔の左右で比べるものが中心、健康な人の老化予防を目的に死亡・寿命などを調べた比較試験は調べた範囲で見つからない。分かっていることは、フレイルの試験で一部の用量・時点だけ偽薬より良かったこと。分かっていないことは、老化を防ぐ効果と自費の治療の安全性。害の報告は、海外の未承認の治療で失明・脊髄の病変・感染、エクソソームの注射のあとの皮膚の壊死・しこり、国内でも幹細胞の治療（慢性の痛みが目的）の投与中に死亡の事案があり死因は調査中。採点は、根拠C・効果小〜不明・安全性低・費用は出典なし。やることは、受ける前に国の公開一覧で確認（効果の保証ではない）、エクソソームは何が入りどこで作られたかを確認、発熱・息苦しさ・皮膚の異変はすぐ受診。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月8日時点の研究と公的資料（小規模な比較試験・症例報告・厚生労働省と学会の資料）に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p><p><a href="https://tools.ichisouzo-lab.com/slides/anti-aging-stem-cell/">スライドで見る</a></p></footer></main>
