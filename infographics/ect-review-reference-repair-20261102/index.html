<h1>電気けいれん療法（ECT）総説 ― 医療従事者のための基礎知識と最新動向</h1>
<p>記事全体の要点をまとめた図解です。数値・対象・限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/10/25/070034">解説記事</a>の本文と参考文献をご確認ください。</p>
<figure id="figure-1">
<a href="infographic.png" target="_blank" rel="noopener"><img src="infographic.png" alt="電気けいれん療法（ECT）の要点の図解。適応はどの病気か（うつ病・躁病・統合失調症など）といまどんな状況かを組み合わせて判断し、本人の意向を含めて総合的に決める。両側性・週3回の研究で75%が寛解。ECT に関連した死亡は治療10万回あたり2.1、重い心血管イベントや死亡は患者のおよそ50人に1人。認知機能の低下は主に治療後3日以内で、認知症が増えるという関連は示されていない。最初の6か月が要注意で、継続 ECT と薬の併用で6か月の再燃が減った" width="1003" height="1568"></a>
