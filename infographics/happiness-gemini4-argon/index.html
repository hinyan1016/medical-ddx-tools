<main><header class="hd"><h1>幸せとは何か</h1><p>哲学・脳科学・大規模研究が示す「3つの幸福」と「5つの習慣」（一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="幸せとは何か：哲学・脳科学・大規模研究が示す3つの幸福と5つの習慣。1.科学が区別する3つの幸福：ヘドニック（いまの心地よさ・喜び）、評価的幸福（人生全体の満足度）、ユーダイモニック（生きる意味・死亡リスク30%低下）。2.生まれつきと脳の仕組み：幸福度の遺伝率36%（残り約64%は環境と日々の行動）、ドーパミンは報酬予測誤差と渇望（Wanting）を駆動、心地よい満足（Liking）は別の小さな脳回路。3.お金と人間関係の大規模研究：苦痛を抱える下位15〜20%は年収10万ドルで頭打ち、30万人の解析でつながりが強い人は生存オッズ50%高い。4.今日からできる5つの習慣：①睡眠を守る、②1回45分・週3〜5回の運動（不調日43.2%減少）、③感謝を3つ書き留める、④頼れる人との時間を守る、⑤誰かの役に立つ役割を持つ。医知創造ラボ｜監修：今村久司（脳神経内科専門医・指導医）"></a></section><footer><p>医知創造ラボ｜監修：今村久司（脳神経内科専門医・指導医）</p><p>内容は査読付き医学・心理学・神経科学論文の一次資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2026/10/20/065900">解説記事（ブログ）を読む</a></p></footer></main>
