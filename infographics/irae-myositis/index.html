<main><header class="hd"><h1>ICIによる筋炎を見逃さない</h1><p>心筋炎・重症筋無力症（MG）の合併（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="免疫チェックポイント阻害薬（ICI）による筋炎を見逃さないための要点。要点は、MGに見えても筋炎と心筋炎を疑うこと、どれか1つを疑ったら3つとも調べること。起こり方は、ICIを受けた人の0.2〜0.4%で、ICIを始めて1か月ほどで起こり、眼瞼下垂・複視・飲み込みにくさ・呼吸の障害が目立つ。合併と死亡では、亡くなる人の多くは心筋炎かMGを合併した例で、眼瞼下垂は心臓を調べるきっかけになる。疑ったときの検査は、筋はCKと針筋電図（CK正常でも否定しない）、神経筋接合部は抗体と反復刺激、心臓はトロポニンT・I、心電図、心臓MRI、呼吸は最大吸気圧と肺活量。注意は、トロポニンTは筋の病気でも上がること、抗AChR抗体だけでMGと決めないこと、CKが下がってもトロポニンの推移を確認すること。治療は、柱はICIの中止とステロイド、MGではIVIGか血漿交換を加える、心筋炎ではステロイドの大量投与を早く始める。どの治療が最もよいかは、まだ決まっていない。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月13日時点の文献と国内の添付文書に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
