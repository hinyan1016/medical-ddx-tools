<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入院中のせん妄を薬に頼らず防ぐ｜医知創造ラボ</title><meta name="description" content="アルツハイマー型認知症の人が急性期入院したときのせん妄を、薬に頼らず防ぐための考え方と多面的なケアを1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>入院中のせん妄を薬に頼らず防ぐ</h1></header><p>アルツハイマー型認知症の人が急性期入院したときのせん妄を、薬に頼らず防ぐための考え方と多面的なケアを1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="アルツハイマー型認知症の人の急性期入院中のせん妄を、薬に頼らず防ぐための図。もともとの弱さ（認知症・高齢・見え方や聞こえの低下）と入院中の誘因（身体拘束・低栄養・薬の追加・カテーテル）が重なるほど起こりやすい。早く気づくために、入院時に危険因子を確認し、家族にふだんの様子を聞き、急な変化は4ATなどで評価する。見当識の支援、睡眠を守る、早期離床、眼鏡と補聴器、水分と栄養、家族の関わり、便秘と痛みへの対応を組み合わせ、身体拘束、不要なカテーテル、せん妄を起こしやすい薬を減らす。抗精神病薬は予防に使わず、強い苦痛や危険があるときに限り短期間検討する。"></a><section><h2>出典と注意</h2><p>NICE CG103、コクランレビュー（2021年）、HELPの原著（1999年）ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/06/06/065621">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
