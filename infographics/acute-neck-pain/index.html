<main><header class="hd"><h1>寝違え（急性の首の痛み）</h1><p>安全な対処法と受診の目安</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="寝違え（急性の首の痛み）、安全な対処法と受診の目安。起床時に首の後ろから肩が痛み、首を動かすと痛む・動かせない。多くは軽症。まずはセルフケアで、はじめは痛い方向に無理に動かさず、数時間から数日で和らいでいくなら徐々に首を動かしていく。消炎鎮痛薬の貼り薬・塗り薬、必要に応じて短期間の内服鎮痛薬を使い、痛みが増えるやり方は避ける。痛みが強い・治らないときは整形外科へ。首が裂けるような痛み・頭痛、ものが二重に見える、めまい・失神、片側の手足の脱力やしびれといった血管の病気を疑う症状は、ためらわず救急へ。発熱や寝汗、発熱とともに首を前に曲げられない、外傷（転倒・事故など）のあと、がんの既往、手足のしびれ・力が入りにくい、歩きにくさ・排尿排便の異常が一部でも当てはまれば早めに受診する。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2026/02/24/185136">解説記事を読む</a></p></footer></main>
