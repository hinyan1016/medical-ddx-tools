<main><header class="hd"><h1>レチノイドの塗り薬で、肌の老化は防げる？</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第14回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="レチノイドの塗り薬で、肌の老化は防げるか。判定は、処方のトレチノインの塗り薬は「効く（条件つき）」。しわ・しみの見た目は基剤より改善するが、老化を止める証明ではない。研究の読み方は、しわ・しみの見た目は複数の解析と試験で改善、試験は古くほとんどが米国、刺激は濃さ・回数・塗り方で変わり濃ければ良いわけではない。分かっていることは、細かいしわ・粗いしわの改善、しみ・くすみの改善、皮膚がんは減らなかったこと。分かっていないことは、長く使った場合の効果と安全性、市販のレチノール化粧品の効果。注意は、使い始めに赤み・皮むけ・乾燥・ひりひり感が出やすいこと、妊娠中・妊娠を考えている人は使わないこと、しわ用のトレチノインは調べた範囲で国内に見つからないこと。採点は、根拠B・効果中・安全性中・費用は未確認。やることは、まず日光を避けふだんから日焼け止めを使う、処方の塗り薬は皮膚科の医師に相談する、妊娠中・妊娠を考えている人は使わない。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月10日時点の研究に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
