<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貧血の前から始まる鉄欠乏｜医知創造ラボ</title><meta name="description" content="貧血になる前の鉄欠乏で起こりうる症状を、根拠の強さで分けて、鉄の働き・起こりやすい人・見逃さないための点とあわせて1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>貧血の前から始まる鉄欠乏</h1></header><p>貧血になる前の鉄欠乏で起こりうる症状を、根拠の強さで分けて、鉄の働き・起こりやすい人・見逃さないための点とあわせて1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="貧血の前から始まる鉄欠乏の図。ヘモグロビンが正常でも症状が出ることがある。貯蔵鉄が減ってフェリチンが低下し、赤血球づくりに鉄が足りなくなり、最後にヘモグロビンが低下する鉄欠乏性貧血になる。前の2段階が貧血のない鉄欠乏。貧血以外の症状は、鉄を補って改善が報告されているもの（疲れやすさ・集中しにくさ・脚がむずむずする・氷を無性に食べたくなる）、関連が指摘されている段階のもの（気分の落ち込み・不安・頭痛・髪が抜ける）、鉄欠乏の手がかりになる所見（さじ状爪・舌炎・口角炎）に分けて示す。鉄には、ミトコンドリアでエネルギーをつくる、神経伝達物質をつくる、コラーゲンをつくる働きもある。鉄欠乏が起こりやすいのは月経のある女性、妊娠中の人、成長期の子ども、献血をくり返す人。見逃さないために、ヘモグロビンだけでなくフェリチンも測り、鉄が足りない原因を探し、鉄剤は医師と相談して使う。"></a><section><h2>出典と注意</h2><p>英国消化器病学会ガイドライン、WHO、米国睡眠医学会ガイドラインほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/06/28/065657">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
