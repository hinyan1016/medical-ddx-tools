<main><header class="hd"><h1>心房細動治療 この20年の変遷</h1><p>2005年頃から現在まで（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="心房細動治療の20年の変遷。脳卒中予防はワルファリンと頻回のINR測定から、ルーチンのモニタリングが不要で頭蓋内出血が少ないDOACへ（日本では2011年から順次承認。中等度以上の僧帽弁狭窄症・機械弁は除く）。リスク評価はCHADS2から、欧米ではCHA2DS2-VAScとCHA2DS2-VA（ESC 2024）へ。日本（JCS）はCHADS2が基本。リズム治療はレートコントロールがしばしば初期戦略だった時代から、EAST-AFNET 4を根拠に早期リズムコントロールを考慮する時代へ（対象は診断から早い時期の一部の患者）。アブレーションはクライオバルーンやパルスフィールド（日本で2024年から）が加わり、一部の発作性AFでは第一選択にも。左心耳閉鎖は長期の抗凝固療法が難しい人の選択肢（日本で2019年から）。検出はホルター心電図から植込み型心臓モニタ・ウェアラブルへ（精度や過剰診断などの課題も）。薬と手技だけでなく包括的なケアへ（ESC 2024 AF-CARE）。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/05/19/193255">解説記事を読む</a></p></footer></main>
