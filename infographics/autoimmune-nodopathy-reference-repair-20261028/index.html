<h1>自己免疫性ノドパシー：疾患概念から診断・治療まで</h1>
<p>記事全体の要点をまとめた図解です。数値・対象・限界は<a href="https://blog.ichisouzo-lab.com/entry/2025/04/05/045433">解説記事</a>の本文と参考文献をご確認ください。</p>
<figure id="figure-1">
<a href="infographic.png" target="_blank" rel="noopener"><img src="infographic.png" alt="自己免疫性ノドパシーのインフォグラフィック。CIDPと診断された患者のごく一部で抗体が見つかり、2021年のEAN/PNSガイドラインはCIDPの亜型とせず別の病気として扱うこと、標的はランビエ絞輪（NF186・NF140）と傍絞輪で、傍絞輪の拡大図ではシュワン細胞の髄鞘ループ側のNF155と、向かい合う軸索側のCNTN1・CASPR1が結合していること、抗体の多くはIgG4で、IgG4抗体は炎症で組織を壊すのではなく蛋白どうしの結合を妨げること、抗体ごとの臨床像（NF155抗体は振戦・運動失調、CNTN1抗体はネフローゼ症候群を合併することがある、CASPR1抗体は痛みを伴うことがある、NF155・NF186・NF140に共通するpan-NF抗体は重い四肢麻痺）、CIDPが疑われる患者で抗体検査を考える手がかりと確認の流れ、治療への反応は抗体とサブクラスで異なり、IVIgは効きにくいことが多くリツキシマブはよく効いたとする報告が多いこと、根拠は観察研究や症例報告が中心で、日本のリツキサン電子添文（2026年6月改訂）では効能・効果にこの病気は含まれないことを示す（2026年10月時点）" width="1024" height="1536"></a>
