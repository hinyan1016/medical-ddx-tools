<main><header class="hd"><h1>処方日数の上限と頓服の回数</h1><p>全国共通のルールを一次資料で整理（医師・薬剤師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="処方日数の上限と頓服の回数の要点。処方日数は、予見できる必要期間で決め、日数の上限があるのは、告示で定められた薬だけ。上限がある薬は、14日分が麻薬と向精神薬のうち30日分・90日分の一覧にないもの、30日分がアルプラゾラムなど、90日分がジアゼパムなどで内服薬だけ。新医薬品は、薬価収載の翌月から1年間、原則として14日分まで。30日を超えて出すときは、病状の安定と服薬管理ができることを確かめ、病状が変わったときの対応と連絡先を伝え、満たさないときは30日以内の再診・紹介・分割指示のどれかにする。分割指示は分割が3回まで。リフィルは3回まで繰り返して使え、2回目以降は前回の投薬が終わる予定の日の前後7日以内。上限のある薬と、鎮痛・消炎の貼付剤はリフィルにできない。頓服は1回分を単位に数え、回数そのものに全国一律の上限を定めた規定は、確認した資料では見つからなかった。処方箋の使用期間は交付の日を含めて4日以内。審査の地域差は、審査基準を原則として全国で統一する方針（2021年の改革工程表）。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月16日時点で確認した告示・通知などの一次資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。処方の前に最新の告示と通知で確認してください。個別の診療判断に代わるものではありません。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/04/26/092856">解説記事を読む（出典は記事の参考文献へ）</a></p></footer></main>
