<main><header class="hd"><h1>無菌性髄膜炎の診療</h1><p>見逃さない疾患の除外から原因別の治療まで（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="無菌性髄膜炎の診療の流れ。培養で細菌・真菌が検出されない髄膜炎で、最多の原因はウイルス。まず細菌性髄膜炎（検査から抗菌薬まで1時間以内）と単純ヘルペス脳炎（受診後6時間以内にアシクロビル）を見逃さず、結果を待たずに治療を始める。診断は髄液検査・頭部MRI・多項目PCRで、陰性でも否定できず培養も必要。原因別の治療は、ウイルス性は対症療法、HSV・VZVはアシクロビル、結核性は抗結核薬4剤とステロイド、クリプトコッカスは抗真菌薬の導入・地固め・維持、薬剤性は原因薬の中止。合併症の低ナトリウム血症（とくに結核性）ではCSWとSIADHを見分け、結核性では水制限を避ける。予後はウイルス性の多くが後遺症なく回復し、結核性・真菌性は重篤で長期のフォローが必要。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/09/25/094947">解説記事を読む</a></p></footer></main>
