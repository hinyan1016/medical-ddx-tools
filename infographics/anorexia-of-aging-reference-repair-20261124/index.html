<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加齢に伴う食欲低下への多面的アプローチ｜医知創造ラボ</title><meta name="description" content="加齢に伴う食欲低下について、原因の重なり、評価の流れ、多職種での支え方を1枚にまとめた図です。"><style>body{margin:0;background:#faf8f3;color:#18354c;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(22px,4vw,34px)}img{display:block;width:100%;height:auto;max-width:1024px;margin:auto;border-radius:12px}a{color:#17628c}section{background:white;padding:22px;border-radius:12px;margin:20px 0}li{margin:8px 0}</style></head><body><main><header><h1>加齢に伴う食欲低下への多面的アプローチ</h1></header><p>加齢に伴う食欲低下について、原因の重なり、評価の流れ、多職種での支え方を1枚にまとめた図です。</p><p style="font-size:0.9rem;color:#567;">画像をクリック／タップすると原寸で表示します。</p><a href="infographic.png" title="画像を原寸表示" target="_blank" rel="noopener noreferrer"><img src="infographic.png" width="1024" height="1536" alt="加齢に伴う食欲低下の図。食欲低下は低栄養、サルコペニア・フレイルへ進む、介入できる老年症候群。原因は、加齢による変化（味覚・嗅覚の低下、早く満腹になる、ホルモンや炎症の変化）と、変えられるものが多い上乗せ要因（病気、薬、口と歯の問題、うつ・認知機能の低下、孤食・孤立）が重なり合う。評価はMNA-SF・SNAQで拾い上げ、病歴・薬の見直し・診察・血液検査で原因を探し、GLIM基準で診断する。支え方は、食事・環境・基礎的なケアを土台に多職種で支え、薬・漢方・サプリメントは慎重に使う（はっきり効くと示された薬はまだない）。"></a><section><h2>出典と注意</h2><p>ESPEN高齢者の臨床栄養・水分補給ガイドライン、Landiらの総説（2016年）ほか、記事の参考文献に基づいて作成。一般的な医学情報であり、個々の診療方針は主治医と相談してください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2025/07/19/013012">記事に戻る</a></p></section><footer style="padding:20px 0;color:#567;">作成・発行：医知創造ラボ</footer></main></body></html>
