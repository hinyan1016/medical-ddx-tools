<main><header class="hd"><h1>プラセンタ注射・サプリで、老化は防げる？</h1><p>医師が4つの物差しで採点（医師が採点するアンチエイジング 第11回・一般向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="プラセンタ注射・サプリで老化は防げるか。判定は、老化予防・美容目的のプラセンタは「まだ分からない」。国が認めた使い道（病気の治療）とは分けて考える。国が認めた使い道は、更年期障害・乳汁分泌不全（注射）と、慢性肝疾患の肝機能の改善（注射）で、美容・老化予防の効能は国内で承認されていない。研究の読み方は、ヒトの試験は小さく短く検査値や自覚スコアが中心、結果は試験ごとに分かれ皮膚の試験は企業の関与が目立つ、老化予防を目的に死亡・骨折・認知症を調べた比較試験は調べた範囲で見つからない。分かっていることは、症状や皮膚の測定値で偽薬より良かった小さな試験はあること。分かっていないことは、老化を防ぐ効果と長期の安全性。害と献血の制限は、注射でショックなどの副作用（頻度は不明）、ヒト由来のため理論上の感染のおそれ、使うと最後の使用日から3か月は献血を待つこと。採点は、根拠C・効果小〜不明・安全性中・費用は出典なし。やることは、症状や病気はまず医師へ、自費の前に承認外・副作用・献血を確認、サプリ・化粧品に薬のような効果は期待しない。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月7日時点の研究と公的資料（医薬品の添付文書・小規模な比較試験・厚生労働省と日本赤十字社の資料）に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p><p><a href="https://tools.ichisouzo-lab.com/slides/anti-aging-placenta/">スライドで見る</a></p></footer></main>
