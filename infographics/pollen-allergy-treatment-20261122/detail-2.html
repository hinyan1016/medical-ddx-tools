<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花粉が少ない日にも症状があるのは？</title><style>*{box-sizing:border-box}body{margin:0;color:#172f3b;background:#fff;font-family:'Yu Gothic','Meiryo',sans-serif;line-break:strict;overflow-wrap:anywhere}main{width:100%;max-width:540px;margin:auto;padding:19px 17px 17px;background:#fff;border:1px solid #c2cfd1;border-top:7px solid var(--c)}header{color:var(--c);font-size:14px;font-weight:700;letter-spacing:.05em}h1{font-size:25px;line-height:1.4;margin:6px 0 15px;font-weight:800}h2{font-size:18px;line-height:1.5;margin:0;color:var(--c)}p{margin:4px 0 0;font-size:16px;line-height:1.64}section{position:relative;padding:11px 0 12px 14px;margin-left:3px;border-left:3px solid var(--c)}section:before{content:'';position:absolute;left:-6px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--c)}section+section{border-top:1px solid #e0e4e4}aside{margin:12px 0 0;padding:11px 12px;background:var(--l);border-radius:4px;font-size:15px;line-height:1.6}footer{margin-top:11px;font-size:12px;color:#465665;line-height:1.55}figure{margin:10px 0}.brow{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-top:8px}.rail{height:11px;background:#e7e9eb;border-radius:2px}.bar{height:100%;background:var(--c);border-radius:2px}b{font-weight:750}.split{display:flex;gap:9px}.split>div{flex:1;background:var(--l);padding:7px;text-align:center}.split b{display:block}.rule{margin:16px 0 5px;padding-top:12px;border-top:1px solid #c7d1d3}.tag{display:inline-block;color:var(--c);font-weight:bold;font-size:17px}svg{width:100%;height:90px;display:block}:root{--c:#74461e;--l:#f8eee0}</style><main><header>スギ花粉症の治療</header><h1>花粉が少ない日にも症状があるのは？</h1><section><h2>花粉量が少ない環境どうしを比較</h2><p>花粉量の条件をそろえ、黄砂・PM2.5の環境指標が低い群と、中～高い群に分けました。</p></section><section><h2>症状と生活への影響を集計</h2><p>アプリ利用者6,468人の研究では、中～高い群で多くの症状スコアが高くなっていました。</p></section><aside>観察研究が示したのは関連です。一人の症状の原因を黄砂と断定することはできません。</aside><footer>資料　アレルサーチ研究（PMID 41407565）</footer><p style="text-align:center"><a href="detail-2.png" target="_blank" rel="noopener noreferrer">&#21407;&#23544;PNG</a></p></main></html>
