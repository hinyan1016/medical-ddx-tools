s="brow"><span>終了後・1シーズン目</span><b>45.3％</b></div><div class="rail"><div class="bar" style="width:45.3%;background:#a56832"></div></div><div class="brow"><span>終了後・2シーズン目</span><b>34％</b></div><div class="rail"><div class="bar" style="width:34.0%;background:#b07746"></div></div><aside>低下率はスコアの群間比較です。「この割合の人が治った」という数字ではありません。</aside><footer>資料　Yonekuraら、2021年（PMID 34333190）</footer><p style="text-align:center"><a href="detail-1.png" target="_blank" rel="noopener noreferrer">&#21407;&#23544;PNG</a></p></main></html>
