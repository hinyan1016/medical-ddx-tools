<main><header class="hd"><h1>レノックス・ガストー症候群の診断</h1><p>ILAE 2022と指定難病の基準から（医師向け）</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="レノックス・ガストー症候群の診断の要点。要点は、強直発作と2つの脳波所見を確かめること、成人では、睡眠を含むビデオ脳波で確かめること。ILAE 2022の必須項目は、強直発作を含む2種類以上の発作、2.5 Hz未満の遅棘徐波、睡眠中のGPFA、18歳未満の発症で、脳波の2項目は以前の脳波の記録でもよい。指定難病144との違いは、強直発作はILAEでは必須だが指定難病ではなくても満たす区分があること、知的障害は指定難病ではすべての区分で求めること、申請は令和6年4月版の基準。注意は、最初から特徴がそろうことはまれ、成人では典型的な遅棘徐波が見られないことが多い、覚醒脳波が正常でもそれだけで否定しない。見分ける病気は、ミオクロニー脱力発作を伴うてんかん、Dravet症候群、DEE-SWAS、前頭葉てんかん。原因を調べるには、MRIを見直す、染色体マイクロアレイ、エクソーム・てんかん遺伝子パネル。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月17日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。</p></footer></main>
