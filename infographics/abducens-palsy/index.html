<main><header class="hd"><h1>外転神経麻痺の原因を見極める</h1><p>成人の単独の眼球運動神経麻痺のなかで最も多い</p></header><section><a href="infographic.png" title="画像のみを原寸で開く"><img src="infographic.png" alt="外転神経麻痺の原因を見極める。成人の単独の眼球運動神経麻痺のなかで最も多い。右の外転神経麻痺で右を見ようとすると、患側の眼球が外転できず、水平方向の二重視が患側を見たときに強くなる。主な原因は微小血管障害（糖尿病や高血圧）、腫瘍による圧迫（髄膜腫・転移性腫瘍）、炎症性疾患（Tolosa-Hunt症候群）、感染症（髄膜炎・Gradenigo症候群）、その他（脳幹梗塞・出血、多発性硬化症、頭蓋内圧亢進による偽局在徴候）で、痛みの有無では原因を区別できない。50歳未満、リスク因子が無い例、他の神経症状を伴う例、症状が進行性である例ではMRIによる評価が勧められ、複数の脳神経麻痺では急いで神経画像検査を行う。50歳以上で血管危険因子がある場合の扱いは意見が分かれており、前向き研究は初期評価でMRIと血液検査を行う意義を示した。見逃さない鑑別はTolosa-Hunt症候群（眼窩部の痛みが先行し、ステロイドで痛みと麻痺が改善）、巨細胞性動脈炎（高齢者、赤沈・CRP）、厳密には神経麻痺ではない重症筋無力症（症状が変動し易疲労性）と甲状腺眼症（牽引試験で受動的にも外転できない）。経過中に悪化や新たな症状があれば再評価し、6か月を過ぎても複視が残れば斜視手術を検討する。"></a></section><footer><p>医知創造ラボ｜監修：今村久司</p><p>内容は2026年10月22日時点の資料に基づきます。図はAI画像生成を用いて制作し、文言を解説記事と照合しています。個別の診療判断に代わるものではありません。<br><a href="https://blog.ichisouzo-lab.com/entry/2025/06/03/034217">解説記事を読む</a></p></footer></main>
