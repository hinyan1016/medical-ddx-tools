<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>猫背改善シリーズ③｜運動療法スライド</title>
  <style>
    :root{font-family:"Noto Sans JP","Yu Gothic UI",sans-serif;color:#102a43;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}.viewer{min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{padding:14px clamp(16px,4vw,48px);background:#fff;border-bottom:1px solid #dce4f0;display:flex;gap:16px;align-items:center}.brand{flex:1;min-width:0}.eyebrow{margin:0;color:#e87510;font-weight:800;font-size:.8rem;letter-spacing:.08em}h1{margin:3px 0 0;font-size:clamp(1rem,2vw,1.4rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counter{font-weight:800;white-space:nowrap}main{display:grid;place-items:center;padding:clamp(10px,2vw,28px)}.stage{width:min(100%,1672px);aspect-ratio:16/9;background:#fff;box-shadow:0 18px 46px rgba(6,42,91,.18);position:relative;overflow:hidden}.slide{width:100%;height:100%;object-fit:contain;display:block}.controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:999px;background:#062a5b;color:#fff;font:inherit;font-weight:700;padding:10px 18px;cursor:pointer}button:hover,button:focus-visible{background:#e87510;outline:3px solid rgba(232,117,16,.3)}button:disabled{opacity:.45;cursor:not-allowed}.hint{margin:10px 0 0;text-align:center;color:#486581;font-size:.9rem}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="viewer"><header><div class="brand"><p class="eyebrow">医知創造ラボ｜猫背改善シリーズ 第3回</p><h1>猫背を改善する運動療法｜安全な7つの実践</h1></div><div id="counter" class="counter" aria-live="polite">1 / 20</div></header><main><div><section class="stage" aria-label="スライド表示"><img id="slide" class="slide" src="assets/slide_01.png" alt="猫背改善シリーズ第3回 スライド1"></section><nav class="controls" aria-label="スライド操作"><button id="prev" type="button">← 前へ</button><button id="next" type="button">次へ →</button><button id="fullscreen" type="button">全画面</button></nav><p class="hint">← → キー、スペースキーでも移動できます</p></div></main></div>
  <script>
    const count=20, img=document.getElementById('slide'), counter=document.getElementById('counter'); let page=Math.min(count,Math.max(1,Number(location.hash.slice(1))||1));
    function show(n){page=Math.min(count,Math.max(1,n));img.src=`assets/slide_${String(page).padStart(2,'0')}.png`;img.alt=`猫背改善シリーズ第3回 スライド${page}`;counter.textContent=`${page} / ${count}`;history.replaceState(null,'',`#${page}`);prev.disabled=page===1;next.disabled=page===count}
    const prev=document.getElementById('prev'),next=document.getElementById('next');prev.onclick=()=>show(page-1);next.onclick=()=>show(page+1);document.getElementById('fullscreen').onclick=()=>document.querySelector('.stage').requestFullscreen?.();document.addEventListener('keydown',e=>{if(['ArrowRight',' '].includes(e.key)){e.preventDefault();show(page+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(page-1)}if(e.key==='Home')show(1);if(e.key==='End')show(count)});show(page);
  </script>
</body>
</html>
