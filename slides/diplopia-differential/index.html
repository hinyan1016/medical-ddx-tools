<style>
  :root {
    --navy: #1B3A5C;
    --blue: #2C5AA0;
    --light-blue: #E8F0FE;
    --bg: #F4F6F8;
    --white: #FFFFFF;
    --text: #222;
    --muted: #666;
    --shadow: 0 2px 12px rgba(27,58,92,0.12);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "游ゴシック", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: var(--white);
    padding: 36px 20px 28px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(27,58,92,0.18);
  }
  header .breadcrumb {
    font-size: 0.82em;
    opacity: 0.75;
    margin-bottom: 10px;
  }
  header .breadcrumb a {
    color: var(--white);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255,255,255,0.5);
  }
  header h1 {
    font-size: 1.55em;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }
  header .subtitle {
    font-size: 0.95em;
    margin-top: 10px;
    opacity: 0.88;
    line-height: 1.5;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 24px 16px; }
  .action-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 0.96em;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: var(--shadow);
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-youtube {
    background: #FF0000;
    color: var(--white);
  }
  .btn-youtube:hover { background: #CC0000; transform: translateY(-1px); }
  .btn-pdf {
    background: var(--navy);
    color: var(--white);
  }
  .btn-pdf:hover { background: var(--blue); transform: translateY(-1px); }
  .btn-blog {
    background: var(--white);
    color: var(--navy);
    border: 2px solid var(--navy);
  }
  .btn-blog:hover { background: var(--light-blue); }
  .btn-deck { background: #FF7A59; color: var(--white); }
  .btn-deck:hover { filter: brightness(0.96); transform: translateY(-1px); }
  .btn-info { background: var(--white); color: #C2410C; border: 2px solid #FF7A59; }
  .btn-info:hover { background: #FFF1EC; }
  .btn-jc { background: var(--blue); color: var(--white); }
  .btn-jc:hover { filter: brightness(0.94); transform: translateY(-1px); }
  .meta-bar {
    text-align: center;
    color: var(--muted);
    font-size: 0.88em;
    margin-bottom: 24px;
  }
  .meta-bar span {
    display: inline-block;
    margin: 0 8px;
  }
  .slide-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .slide-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .slide-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(27,58,92,0.2);
  }
  .slide-card img {
    width: 100%;
    height: auto;
    display: block;
  }
  .slide-card .slide-num {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(27,58,92,0.85);
    color: var(--white);
    font-size: 0.78em;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 64px 20px 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox-img-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .lightbox.original .lightbox-img-wrap {
    display: block;
    overflow: auto;
    overscroll-behavior: contain;
  }
  .lightbox.original img {
    display: block;
    max-width: none;
    max-height: none;
    border-radius: 0;
    box-shadow: none;
  }
  .lightbox-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--white);
    margin-top: 16px;
    font-size: 0.95em;
  }
  .lightbox-btn {
    background: rgba(255,255,255,0.15);
    color: var(--white);
    border: none;
    border-radius: 999px;
    width: 44px;
    height: 44px;
    font-size: 1.4em;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  .lightbox-btn:hover { background: rgba(255,255,255,0.3); }
  .lightbox-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .lightbox-size {
    width: auto;
    padding: 0 14px;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.15);
    color: var(--white);
    border: none;
    border-radius: 999px;
    width: 44px;
    height: 44px;
    font-size: 1.2em;
    cursor: pointer;
    z-index: 10;
  }
  .lightbox-counter {
    font-variant-numeric: tabular-nums;
    min-width: 80px;
    text-align: center;
  }
  .info-box {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 24px;
    border-left: 4px solid var(--blue);
    font-size: 0.94em;
    color: #444;
  }
  .info-box strong { color: var(--navy); }
  footer {
    max-width: 1080px;
    margin: 40px auto 0;
    padding: 24px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85em;
    line-height: 1.8;
  }
  footer a {
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px dotted var(--navy);
  }
  @media (max-width: 600px) {
    header h1 { font-size: 1.3em; }
    .container { padding: 20px 12px; }
    .slide-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .btn { padding: 10px 18px; font-size: 0.9em; }
    .lightbox { padding-inline: 8px; }
    .lightbox-controls { gap: 8px; }
    .lightbox-counter { min-width: 64px; }
  }
#slideGrid .slide-num{position:static;display:block;width:fit-content;margin:6px 8px;}

<script>
(function(){
  var slideCount = 12;
  var current = 0;
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lbClose = document.getElementById('lbClose');
  var lbViewport = document.getElementById('lbViewport');
  var lbSize = document.getElementById('lbSize');
  var cards = document.querySelectorAll('.slide-card');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function srcOf(i) {
    // ビルダーは表紙をPNG、2枚目以降をWebPで配置する。一覧と同じ画像を使う。
    var images = document.getElementById('slideGrid').querySelectorAll('img');
    return images[i].getAttribute('src');
  }

  function show(i) {
    if (i < 0) i = 0;
    if (i >= slideCount) i = slideCount - 1;
    current = i;
    lbImg.src = srcOf(i);
    lbImg.alt = 'スライド ' + (i + 1);
    lbCounter.textContent = (i + 1) + ' / ' + slideCount;
    lbPrev.disabled = (i === 0);
    lbNext.disabled = (i === slideCount - 1);
  }

  function setOriginal(enabled) {
    lightbox.classList.toggle('original', enabled);
    lbSize.textContent = enabled ? '画面に合わせる' : '原寸表示';
    if (enabled) lbViewport.setAttribute('tabindex', '0');
    else lbViewport.removeAttribute('tabindex');
    lbViewport.scrollTo(0, 0);
  }

  function open(i) {
    show(i);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lightbox.classList.remove('open');
    setOriginal(false);
    document.body.style.overflow = '';
  }

  for (var i = 0; i < cards.length; i++) {
    (function(idx){
      cards[idx].addEventListener('click', function(){ open(idx); });
    })(i);
  }

  lbPrev.addEventListener('click', function(){ show(current - 1); });
  lbNext.addEventListener('click', function(){ show(current + 1); });
  lbClose.addEventListener('click', close);
  lbSize.addEventListener('click', function(){
    setOriginal(!lightbox.classList.contains('original'));
  });
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) close();
  });

  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') { close(); return; }
    if (lightbox.classList.contains('original')) return;
    if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
  });

  // Touch swipe
  var touchStartX = 0;
  lightbox.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive: true});
  lightbox.addEventListener('touchend', function(e){
    if (lightbox.classList.contains('original')) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 50) return;
    if (dx > 0) show(current - 1);
    else show(current + 1);
  }, {passive: true});
})();
</script>
