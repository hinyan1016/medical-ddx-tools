<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>右外転神経麻痺の例｜右方視での両眼と複視</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "BIZ UDPGothic", "Yu Gothic", Meiryo, sans-serif; color: #18354c; background: #f2f5f6; }
    .fig { margin: auto; padding: 34px 38px 24px; max-width: 960px; background: #fff; border-top: 8px solid #1a5276; }
    h1 { margin: 0 0 10px; font-size: clamp(23px,4.4vw,40px); line-height: 1.32; }
    header p { margin: 0; color: #475f70; font-size: clamp(14px,2vw,19px); line-height: 1.65; }
    .comparison { display: grid; grid-template-columns: 1.22fr 1fr; gap: 16px; margin: 24px 0 19px; }
    section { display: flex; flex-direction: column; padding: 21px 20px 17px; border-radius: 9px; background: #ecf3f7; }
    section.patient { background: #f5f1e8; }
    h2 { margin: 0; font-size: clamp(18px,2.7vw,25px); line-height: 1.4; }
    .picture { display: grid; align-items: center; flex: 1; min-height: 185px; }
    svg { display: block; width: 100%; height: auto; }
    .reading { margin: 5px 0 0; border-top: 1px solid #b8cbd5; padding-top: 12px; min-height: 66px; font-size: clamp(15px,2vw,19px); line-height: 1.55; }
    .patient .reading { border-color: #cfc5af; }
    .credit { color: #526675; font-size: 14px; line-height: 1.65; margin: 0; }
    a { color: inherit; text-underline-offset: 2px; }
    @media (max-width: 630px) {
      .fig { padding: 20px 15px 16px; border-top-width: 5px; }
      .comparison { grid-template-columns: 1fr; gap: 12px; margin: 14px 0; }
      section { padding: 14px 14px 12px; }
      .picture { min-height: 0; }
      svg { max-width: 385px; margin: auto; }
      .reading { min-height: 0; padding-top: 8px; }
      .credit { font-size: 12px; }
    }
  </style>
</head>
<body>
<main class="fig">
  <header>
    <h1>右外転神経麻痺の例</h1>
    <p>顔は正面のまま、患者の右側にある一つの視標を両眼で見てもらいます。</p>
  </header>
  <div class="comparison">
    <section>
      <h2>診察者が正面から見た両眼</h2>
      <div class="picture">
        <svg viewBox="0 0 420 188" role="img" aria-label="患者の右方は正面から見ると図の左。図の左にある患者の右眼はほぼ中央にとどまり、図の右にある患者の左眼は鼻側に動く。">
          <defs>
            <path id="eye" d="M-68,0 Q-9,-47 64,0 Q4,38 -68,0Z"/>
            <clipPath id="lid"><use href="#eye"/></clipPath>
          </defs>
          <path d="M184 28H53m13-9-14 9 14 9" fill="none" stroke="#1a5276" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="196" y="34" font-size="20" font-weight="700" fill="#1a5276">患者の右方へ</text>
          <g transform="translate(108 96)">
            <use href="#eye" fill="#fff" stroke="#365368" stroke-width="3.3"/>
            <g clip-path="url(#lid)">
              <circle cx="-3" cy="0" r="21" fill="#6d8b96" stroke="#304b5a" stroke-width="2"/>
              <circle cx="-3" cy="0" r="9" fill="#1f3541"/>
            </g>
          </g>
          <g transform="translate(312 96)">
            <use href="#eye" transform="scale(-1 1)" fill="#fff" stroke="#365368" stroke-width="3.3"/>
            <g clip-path="url(#lid)">
              <ellipse cx="-37" cy="0" rx="17" ry="21" fill="#6d8b96" stroke="#304b5a" stroke-width="2"/>
              <ellipse cx="-37" cy="0" rx="7.5" ry="9" fill="#1f3541"/>
            </g>
          </g>
          <path d="M205 96 Q206 110 202 117 M215 96 Q213 109 217 117" fill="none" stroke="#b7c8d0" stroke-width="2.4" stroke-linecap="round"/>
          <text x="108" y="151" text-anchor="middle" font-size="23" font-weight="700" fill="#18354c">患者の右眼</text>
          <text x="312" y="151" text-anchor="middle" font-size="23" font-weight="700" fill="#18354c">患者の左眼</text>
        </svg>
      </div>
      <p class="reading">右眼は外側へ十分に動かず、左眼は鼻側へ動きます。</p>
    </section>
    <section class="patient">
      <h2>患者に見える像</h2>
      <div class="picture">
        <svg viewBox="0 0 320 168" role="img" aria-label="一つの十字の視標が同じ高さに二つ並んで見える例。">
          <g fill="#2d584f">
            <path d="M91 48h13v22h22v13h-22v22H91V83H69V70h22Z"/>
            <path d="M216 48h13v22h22v13h-22v22h-13V83h-22V70h22Z"/>
          </g>
          <path d="M104 125h111m-103-6-9 6 9 6m94-12 9 6-9 6" fill="none" stroke="#807963" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="reading">像が横に二つ並びます。典型例では麻痺側を見ると、二つの像がさらに離れます。</p>
    </section>
  </div>
  <footer><p class="credit">医知創造ラボ作図。眼位と像の間隔は模擬症例の模式表示。<br>所見の出典　<a href="https://www.aao.org/Assets/f946258f-83a6-44b0-b736-0beb96d83cc1/638434228319570000/adult-strabismus-ppp-pdf">American Academy of Ophthalmology, Adult Strabismus Preferred Practice Pattern®, 2024, § IIJ.</a></p></footer>
</main>
</body>
</html>
