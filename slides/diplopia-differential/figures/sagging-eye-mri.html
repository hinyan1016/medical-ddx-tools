<figure class="fig">
  <h1>サギングアイ症候群で見られる眼窩の変化</h1>
  <p class="tech">異なる2人の左眼窩。いずれもT1強調・準冠状断MRI。</p>
  <div class="scan"><a href="kono-2025-fig1.jpg" aria-label="原図を拡大"><img src="kono-2025-fig1.jpg" alt="左眼窩MRIの2例。両パネルの斜めの矢印が外直筋と上直筋を結ぶバンドの断裂部を示す。aでは外直筋と内直筋の下方偏位を伴う。"></a></div>

    <p><b class="panel">b</b> 別の患者の左眼窩です。斜めの矢印が同じバンドの高度な断裂を示します。</p>
