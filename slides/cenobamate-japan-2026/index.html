<script>
(function(){
  var slideCount = 14;
  var current = 0;
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lbClose = document.getElementById('lbClose');
  var cards = document.querySelectorAll('.slide-card');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function srcOf(i) { return 'slide-' + pad(i + 1) + '.png'; }

  function show(i) {
    if (i < 0) i = 0;
    if (i >= slideCount) i = slideCount - 1;
    current = i;
    lbImg.src = srcOf(i);
    lbImg.alt = 'スライド ' + (i + 1);
    lbCounter.textContent = (i + 1) + ' / ' + slideCount;
    lbPrev.disabled = (i === 0);
    lbNext.disabled = (i === slideCount - 1);
  }

  function open(i) {
    show(i);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }

  function close() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    cards[current].focus();
  }

  for (var i = 0; i < cards.length; i++) {
    (function(idx){
      cards[idx].addEventListener('click', function(){ open(idx); });
    })(i);
  }

  lbPrev.addEventListener('click', function(){ show(current - 1); });
  lbNext.addEventListener('click', function(){ show(current + 1); });
  lbClose.addEventListener('click', close);
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) close();
  });

  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Tab') { e.preventDefault(); var buttons = [lbClose, lbPrev, lbNext].filter(function(b){return !b.disabled;}); var pos=buttons.indexOf(document.activeElement); buttons[(pos+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus(); }
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'Escape') close();
  });

  // Touch swipe
  var touchStartX = 0;
  lightbox.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive: true});
  lightbox.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 50) return;
    if (dx > 0) show(current - 1);
    else show(current + 1);
  }, {passive: true});
})();
</script>
