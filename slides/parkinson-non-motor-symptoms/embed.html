<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18354c"><title>パーキンソン病の非運動症状とは？｜スライドビュアー</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"BIZ UDPGothic","Yu Gothic",sans-serif;background:#f1f5f9;color:#172337}body{display:flex;flex-direction:column}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;position:relative;user-select:none;cursor:pointer}.stage img{max-width:100%;max-height:100%;object-fit:contain;width:100%;height:100%}nav{flex:0 0 52px;display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 8px;border-top:1px solid #d6dfeb;background:#f8fafc}button,a{font:inherit}button{min-height:40px;min-width:48px;padding:6px 12px;border:0;border-radius:6px;background:#18354c;color:#fff;cursor:pointer;font-weight:700}button:hover:not(:disabled){background:#2877a7}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #2877a7;outline-offset:2px}#counter{font-variant-numeric:tabular-nums;min-width:58px;text-align:center;font-weight:700;color:#18354c}a{color:#18354c;white-space:nowrap;text-decoration:underline;font-size:13px;font-weight:600}@media(max-width:420px){nav{gap:8px}button{padding:6px 10px;min-width:42px}a{font-size:12px}}</style></head>
<body><main class="stage" id="stage"><img id="slide" src="slide-01.png" alt="スライド1：パーキンソン病の非運動症状：便秘・睡眠・立ちくらみ・気分の変化と受診の目安"></main>
<nav aria-label="スライド操作"><button id="prev" type="button" aria-label="前のスライド">‹</button><span id="counter" aria-live="polite">1 / 12</span><button id="next" type="button" aria-label="次のスライド">›</button><a href="./" target="_blank" rel="noopener">拡大・一覧</a><a href="deck.html" target="_blank" rel="noopener">HTML版</a><a href="slides.pdf" target="_blank" rel="noopener">PDF</a></nav>
<script>(function(){var titles=["パーキンソン病の非運動症状：便秘・睡眠・立ちくらみ・気分の変化と受診の目安", "仕組みと出現時期：自律神経や睡眠・気分の神経系も変化します", "非運動症状の頻度：1,072人の調査で98.6%にみられました", "自律神経の症状①：便秘と立ちくらみの特徴と対策", "自律神経の症状②：夜間頻尿・尿意切迫と、汗・よだれの変化", "睡眠の症状①：夜間に目が覚める不眠と、夢で動く症状（RBD）", "睡眠の症状②：日中の強い眠気と、前兆のない突発的睡眠", "気分と意欲の変化：気分の落ち込みや意欲低下も神経の変化が関与", "認知機能と幻視：段取りのつけにくさと、夕方に出やすい幻視", "感覚症状と薬の注意：におい・痛み・疲労と、お薬の4つの注意点", "診察での伝え方：困っている非運動症状を、主治医に伝える手順", "まとめ：非運動症状も病気の一部として主治医へ相談を"];var count=titles.length;var n=0;var image=document.getElementById("slide");var prev=document.getElementById("prev");var next=document.getElementById("next");var counter=document.getElementById("counter");var touchX=null;function show(i){n=Math.max(0,Math.min(count-1,i));var number=n+1;image.src="slide-"+(number<10?"0":"")+number+".png";image.alt="スライド"+number+"："+titles[n];counter.textContent=number+" / "+count;prev.disabled=n===0;next.disabled=n===count-1;}prev.onclick=function(){show(n-1);};next.onclick=function(){show(n+1);};document.addEventListener("keydown",function(e){if(e.key==="ArrowLeft"){e.preventDefault();show(n-1);}if(e.key==="ArrowRight"){e.preventDefault();show(n+1);}if(e.key==="Home"){e.preventDefault();show(0);}if(e.key==="End"){e.preventDefault();show(count-1);}});var stage=document.getElementById("stage");stage.addEventListener("click",function(e){var rect=stage.getBoundingClientRect();var x=e.clientX-rect.left;if(x<rect.width*0.35){if(n>0)show(n-1);}else{if(n<count-1)show(n+1);}});stage.addEventListener("touchstart",function(e){touchX=e.changedTouches[0].clientX;},{passive:true});stage.addEventListener("touchend",function(e){if(touchX===null)return;var dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>40)show(n+(dx<0?1:-1));touchX=null;},{passive:true});show(0);}());</script></body></html>
