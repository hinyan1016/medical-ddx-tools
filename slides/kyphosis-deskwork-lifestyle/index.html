<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="猫背改善シリーズ第4回。デスクワークと日常習慣を整えるための10枚のスライド。">
  <title>猫背改善シリーズ第4回｜デスクワーク・日常習慣編</title>
  <style>
    :root{font-family:"Noto Sans JP","Yu Gothic UI",sans-serif;color:#132b4b;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}.wrap{min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:1rem;padding:1rem clamp(1rem,4vw,4rem);background:#fff;border-bottom:1px solid #dbe4ea}.brand{flex:1;min-width:0}.eyebrow{margin:0 0 .2rem;color:#d76d00;font-size:.78rem;font-weight:800;letter-spacing:.06em}h1{margin:0;font-size:clamp(1rem,2vw,1.45rem)}.counter{font-weight:800;white-space:nowrap}main{display:grid;place-items:center;padding:clamp(.75rem,2vw,1.75rem)}.stage{width:min(100%,1672px);aspect-ratio:16/9;position:relative;background:#fff;box-shadow:0 16px 42px #1234}.slide{width:100%;height:100%;display:block;object-fit:contain}.controls{position:absolute;inset:auto 0 1rem;display:flex;justify-content:center;gap:.6rem}button{border:0;border-radius:999px;background:#07325f;color:#fff;font:inherit;font-weight:700;padding:.65rem 1rem;cursor:pointer;box-shadow:0 2px 10px #0126}button:hover,button:focus-visible{background:#d76d00;outline:3px solid #f3ad62}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:600px){header{align-items:flex-start}.controls{bottom:.5rem}button{padding:.5rem .7rem}}
  </style>
</head>
<body>
<div class="wrap"><header><div class="brand"><p class="eyebrow">医知創造ラボ｜猫背改善シリーズ 第4回</p><h1>デスクワーク・日常習慣編</h1></div><div id="counter" class="counter" aria-live="polite">1 / 10</div></header><main><section class="stage" aria-label="猫背改善シリーズ第4回のスライド"><img id="slide" class="slide" src="images/slide_01.png" alt="猫背改善シリーズ第4回 デスクワーク・日常習慣編"><nav class="controls" aria-label="スライド操作"><button id="prev" type="button">← 前へ</button><button id="next" type="button">次へ →</button><button id="full" type="button">全画面</button></nav></section></main></div>
<script>
const total=10,slide=document.getElementById('slide'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');let page=Math.min(total,Math.max(1,Number(location.hash.slice(1))||1));function show(n){page=Math.min(total,Math.max(1,n));slide.src=`images/slide_${String(page).padStart(2,'0')}.png`;slide.alt=`猫背改善シリーズ第4回 スライド ${page}`;counter.textContent=`${page} / ${total}`;prev.disabled=page===1;next.disabled=page===total;history.replaceState(null,'',`#${page}`)}prev.onclick=()=>show(page-1);next.onclick=()=>show(page+1);document.getElementById('full').onclick=()=>document.querySelector('.stage').requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(page-1);if(e.key==='ArrowRight'||e.key===' ')show(page+1);if(e.key==='Home')show(1);if(e.key==='End')show(total)});show(page);
</script>
</body>
</html>
