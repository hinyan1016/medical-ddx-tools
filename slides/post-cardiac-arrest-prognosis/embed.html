<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203d69"><title>蘇生後の脳機能予後評価｜改訂スライド</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"BIZ UDPGothic",sans-serif;background:#f1f5f9;color:#172337}body{display:flex;flex-direction:column}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:white}.stage img{max-width:100%;max-height:100%;object-fit:contain;width:100%;height:100%}nav{flex:0 0 52px;display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 8px;border-top:1px solid #d6dfeb}button,a{font:inherit}button{min-height:40px;min-width:48px;padding:6px 12px;border:0;border-radius:6px;background:#203d69;color:white;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #078779;outline-offset:2px}#counter{font-variant-numeric:tabular-nums;min-width:54px;text-align:center}a{color:#203d69;white-space:nowrap;text-decoration:underline;font-size:13px}@media(max-width:390px){nav{gap:8px}button{padding:6px 10px}}</style></head>
<body><main class="stage" id="stage"><img id="slide" src="slide-01.png" alt="スライド1：蘇生後の脳機能予後評価"></main>
<nav aria-label="スライド操作"><button id="prev" type="button" aria-label="前のスライド">‹</button><span id="counter" aria-live="polite">1 / 16</span><button id="next" type="button" aria-label="次のスライド">›</button><a href="./" target="_blank" rel="noopener">拡大・一覧</a><a href="slides.pdf" target="_blank" rel="noopener">PDF</a></nav>
<script>(function(){var count=16;var n=0;var image=document.getElementById('slide');var prev=document.getElementById('prev');var next=document.getElementById('next');var counter=document.getElementById('counter');var touchX=null;function show(i){n=Math.max(0,Math.min(count-1,i));var number=n+1;image.src='slide-'+(number<10?'0':'')+number+(number===1?'.png':'.webp');image.alt='スライド'+number+'：蘇生後の脳機能予後評価（2026年改訂）';counter.textContent=number+' / '+count;prev.disabled=n===0;next.disabled=n===count-1;}prev.onclick=function(){show(n-1);};next.onclick=function(){show(n+1);};document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){e.preventDefault();show(n-1);}if(e.key==='ArrowRight'){e.preventDefault();show(n+1);}if(e.key==='Home'){e.preventDefault();show(0);}if(e.key==='End'){e.preventDefault();show(count-1);}});document.getElementById('stage').addEventListener('touchstart',function(e){touchX=e.changedTouches[0].clientX;},{passive:true});document.getElementById('stage').addEventListener('touchend',function(e){if(touchX===null)return;var dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>40)show(n+(dx<0?1:-1));touchX=null;},{passive:true});show(0);}());</script></body></html>
