<html lang="ja">
<head>

<meta property="og:description" content="神経内科領域における高血圧治療についての全54枚のスライド資料。脳を守る血圧管理から、脳や神経疾患が引き起こす血圧異常、急性期と慢性期の違い、最新エビデンスまで完全網羅。">

<title>神経内科領域における高血圧治療について｜スライド資料（全54枚） | 医知創造ラボ</title>
<style>
  :root {
    --navy: #1B3A5C;
    --blue: #2C5AA0;
    --light-blue: #E8F0FE;
    --bg: #F4F6F8;
    --white: #FFFFFF;
    --text: #222;
    --muted: #666;
    --shadow: 0 2px 12px rgba(27,58,92,0.12);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "游ゴシック", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: var(--white);
    padding: 36px 20px 28px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(27,58,92,0.18);
  }
  header .breadcrumb {
    font-size: 0.85em;
    opacity: 0.85;
    margin-bottom: 10px;
  }
  header .breadcrumb a {
    color: var(--white);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255,255,255,0.5);
  }
  header h1 {
    font-size: 1.6em;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }
  header .subtitle {
    font-size: 0.95em;
    margin-top: 10px;
    opacity: 0.9;
    line-height: 1.5;
  }
  .container { max-width: 1120px; margin: 0 auto; padding: 24px 16px; }
  .action-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 0.96em;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: var(--shadow);
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-pdf {
    background: var(--navy);
    color: var(--white);
  }
  .btn-pdf:hover { background: var(--blue); transform: translateY(-1px); }
  .btn-blog {
    background: var(--white);
    color: var(--navy);
    border: 2px solid var(--navy);
  }
  .btn-blog:hover { background: var(--light-blue); transform: translateY(-1px); }

  .viewer-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  .slide-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide-viewport img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
  }
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 54px;
    height: 54px;
    background: rgba(27,58,92,0.85);
    color: var(--white);
    border: none;
    border-radius: 50%;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 5;
  }
  .nav-arrow:hover { background: var(--blue); transform: translateY(-50%) scale(1.08); }
  .nav-arrow.prev { left: 14px; }
  .nav-arrow.next { right: 14px; }
  .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

  .viewer-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .counter {
    font-size: 1.05em;
    font-weight: 700;
    color: var(--navy);
  }
  .control-buttons {
    display: flex;
    gap: 8px;
  }
  .ctrl-btn {
    background: var(--light-blue);
    color: var(--navy);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { background: #d0e1fd; }

  .keyboard-hint {
    text-align: center;
    font-size: 0.85em;
    color: var(--muted);
    margin-top: 10px;
  }

  .thumbnails-section {
    margin-top: 36px;
  }
  .thumbnails-section h2 {
    font-size: 1.25em;
    color: var(--navy);
    margin-bottom: 16px;
    border-left: 4px solid var(--blue);
    padding-left: 10px;
  }
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .thumb-item {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    background: #e0e0e0;
  }
  .thumb-item:hover { border-color: var(--blue); transform: scale(1.02); }
  .thumb-item.active { border-color: var(--navy); box-shadow: 0 0 0 2px var(--blue); }
  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .thumb-item .thumb-num {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.25em; }
    .nav-arrow { width: 42px; height: 42px; font-size: 20px; }
    .thumb-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="breadcrumb">
    <a href="../../">医知創造ラボ</a> &gt; <span>スライド資料</span>
  </div>
  <h1>神経内科領域における高血圧治療について</h1>
  <div class="subtitle">全54スライド・完全解説資料｜脳を守る血圧管理と神経疾患が乱す血圧</div>
</header>

<div class="container">
  <div class="action-bar">
    <a href="slides.pdf" target="_blank" rel="noopener" class="btn btn-pdf">
      <span>📄 PDFをダウンロード</span>
    </a>
    <a href="https://blog.ichisouzo-lab.com/entry/2026/09/03/194357" class="btn btn-blog">
      <span>📝 解説ブログ記事を読む</span>
    </a>
  </div>

  <div class="viewer-card">
    <div class="slide-viewport" id="viewport">
      <button class="nav-arrow prev" id="prevBtn" aria-label="前のスライド">&#10094;</button>
      <img id="mainSlide" src="slide-01.png" alt="スライド 1 / 54" loading="eager">
      <button class="nav-arrow next" id="nextBtn" aria-label="次のスライド">&#10095;</button>
    </div>

    <div class="viewer-controls">
      <div class="counter" id="counter">1 / 54</div>
      <div class="control-buttons">
        <button class="ctrl-btn" id="firstBtn">最初へ</button>
        <button class="ctrl-btn" id="fsBtn">全画面表示</button>
        <button class="ctrl-btn" id="lastBtn">最後へ</button>
      </div>
    </div>
    <div class="keyboard-hint">キーボードの [←] [→] キーまたは画面タップ・スワイプでページ送りできます</div>
  </div>

  <div class="thumbnails-section">
    <h2>全スライド一覧（54枚）</h2>
    <div class="thumb-grid" id="thumbGrid"></div>
  </div>
</div>

<script>
  const TOTAL_SLIDES = 54;
  let currentSlide = 1;

  const mainSlide = document.getElementById('mainSlide');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const thumbGrid = document.getElementById('thumbGrid');
  const fsBtn = document.getElementById('fsBtn');
  const viewport = document.getElementById('viewport');

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function getSlideSrc(num) {
    return `slide-${pad(num)}.png`;
  }

  function updateView() {
    mainSlide.src = getSlideSrc(currentSlide);
    mainSlide.alt = `スライド ${currentSlide} / ${TOTAL_SLIDES}`;
    counter.textContent = `${currentSlide} / ${TOTAL_SLIDES}`;
    prevBtn.disabled = currentSlide === 1;
    nextBtn.disabled = currentSlide === TOTAL_SLIDES;

    document.querySelectorAll('.thumb-item').forEach((item, idx) => {
      if (idx + 1 === currentSlide) {
        item.classList.add('active');
        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        item.classList.remove('active');
      }
    });
  }

  function goTo(num) {
    if (num < 1 || num > TOTAL_SLIDES) return;
    currentSlide = num;
    updateView();
  }

  function next() { goTo(currentSlide + 1); }
  function prev() { goTo(currentSlide - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  document.getElementById('firstBtn').addEventListener('click', () => goTo(1));
  document.getElementById('lastBtn').addEventListener('click', () => goTo(TOTAL_SLIDES));

  // キーボード操作
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      next();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      prev();
    } else if (e.key === 'Home') {
      e.preventDefault();
      goTo(1);
    } else if (e.key === 'End') {
      e.preventDefault();
      goTo(TOTAL_SLIDES);
    } else if (e.key === 'f' || e.key === 'F') {
      toggleFullScreen();
    }
  });

  // 全画面
  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      viewport.requestFullscreen().catch(err => alert(err.message));
    } else {
      document.exitFullscreen();
    }
  }
  fsBtn.addEventListener('click', toggleFullScreen);

  // スワイプ操作（タッチデバイス）
  let touchStartX = 0;
  viewport.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  viewport.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 40) {
      if (diff < 0) next();
      else prev();
    }
  }, { passive: true });

  // サムネイル生成
  for (let i = 1; i <= TOTAL_SLIDES; i++) {
    const item = document.createElement('div');
    item.className = 'thumb-item' + (i === 1 ? ' active' : '');
    item.innerHTML = `<img src="${getSlideSrc(i)}" alt="Slide ${i}" loading="lazy"><span class="thumb-num">${i}</span>`;
    item.addEventListener('click', () => goTo(i));
    thumbGrid.appendChild(item);
  }

  updateView();
</script>

</body>
</html>
