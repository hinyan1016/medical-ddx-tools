<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGSの治療：薬の調整と専門評価を並行する</title>
<style>body{margin:0;background:#edf2f6;color:#18354c;font-family:"BIZ UDPGothic","Yu Gothic",sans-serif}.fig{max-width:1080px;width:100%;margin:auto;background:white}header{padding:38px 44px 12px}h1{font-size:38px;line-height:1.45;margin:0 0 14px}.intro{font-size:23px;line-height:1.8;margin:0}svg{width:100%;display:block;height:auto}footer{padding:16px 44px 32px;font-size:17px;line-height:1.8;border-top:1px solid #dae3ed}a{color:#1a5276}.caption{font-size:22px;line-height:1.8;padding:0 44px 28px;margin:0}@media(max-width:500px){header{padding:24px 20px 8px}h1{font-size:26px}.intro,.caption{font-size:17px}.caption,footer{padding-left:20px;padding-right:20px}footer{font-size:13px}}</style></head>
<body><article class="fig"><header><h1>LGSの治療は、薬の調整と専門評価を並行して進める</h1><p class="intro">本人と家族の治療目標を共有し、発作だけでなく日中の生活も評価します。</p></header>
<section aria-label="治療と再評価の関係図"><svg viewBox="0 0 1080 710" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">治療目標を共有し、薬の調整と専門施設での評価を並行して進める関係図</title><desc id="figure-desc">治療目標から二つに分かれ、左は薬の効果と副作用を評価し調整する経路、右は食事療法や外科治療を専門施設で検討する経路。両者を踏まえて、発作・覚醒度・生活の変化を本人と家族と見直す。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#58758d"/></marker></defs>
<rect x="245" y="40" width="590" height="100" rx="22" fill="#18354c"/><text x="540" y="104" text-anchor="middle" fill="#fff" font-size="37" font-weight="700">治療目標を共有する</text>
<path d="M540 140 V180 H285 V225 M540 180 H795 V225" fill="none" stroke="#58758d" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M285 180 V225" fill="none" stroke="#58758d" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="55" y="245" width="460" height="230" rx="22" fill="#edf6fa" stroke="#2877a7" stroke-width="3"/><rect x="565" y="245" width="460" height="230" rx="22" fill="#e7f5f2" stroke="#138477" stroke-width="3"/>
<text x="285" y="310" text-anchor="middle" fill="#1a5276" font-size="37" font-weight="700">薬を調整する</text><text x="285" y="374" text-anchor="middle" fill="#334155" font-size="29">効果と副作用を確認</text><text x="285" y="424" text-anchor="middle" fill="#334155" font-size="29">国内適応・併用薬を確認</text>
<text x="795" y="310" text-anchor="middle" fill="#0d756b" font-size="37" font-weight="700">専門施設で評価する</text><text x="795" y="374" text-anchor="middle" fill="#334155" font-size="29">ケトン食療法</text><text x="795" y="424" text-anchor="middle" fill="#334155" font-size="29">切除・脳梁離断・VNS</text>
<path d="M285 475 V525 H540 M795 475 V525 H540 V565" fill="none" stroke="#58758d" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="95" y="585" width="890" height="90" rx="20" fill="#faf4e9" stroke="#b08a49" stroke-width="2"/><text x="540" y="640" text-anchor="middle" fill="#18354c" font-size="32" font-weight="700">発作・覚醒度・生活の変化を見直す</text>
</svg></section>
<p class="caption">すべての薬を試し終えるまで、専門施設への相談を待つ必要はありません。検査結果と本人・家族の希望を踏まえて検討します。</p>
<footer>診療を整理するための自作模式図。個別の処方手順や治療効果を保証する図ではありません。<br>根拠：<a href="https://doi.org/10.1002/epi4.13075">Auvin et al. 2025, §6.1.1</a>／<a href="https://www.nanbyou.or.jp/entry/4889">難病情報センター</a>。確認日：2026年10月17日。<br>監修：今村久司（脳神経内科医）／医知創造ラボ</footer>
</article></body></html>
