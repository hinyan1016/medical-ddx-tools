<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レケンビとケサンラ比較｜RC7スライド全30枚</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#203b69;font-family:Arial,"Yu Gothic",sans-serif}main{max-width:1200px;margin:auto;padding:12px}h1{font-size:clamp(16px,3vw,25px);margin:0 0 12px}#slide{display:block;width:100%;height:auto;background:white;aspect-ratio:16/9;border:1px solid #cad5e7}.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0;flex-wrap:wrap}button,select{font:inherit;min-height:44px;border:1px solid #9aabc5;border-radius:7px;padding:8px 14px;background:white;color:#203b69}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #087ee6}#counter{font-weight:bold;min-width:65px;text-align:center}a{color:#145c9b}p{font-size:14px;line-height:1.7;margin:8px 0}.embed h1,.embed .details{display:none}.embed main{padding:6px}.embed .controls{margin:8px 0;gap:8px}.embed button,.embed select{padding:7px 10px}@media(max-width:480px){main{padding:6px}.controls{gap:8px}button,select{padding:8px}p{font-size:12px}}</style></head><body><main>
<h1>レケンビとケサンラ比較｜全30枚</h1>
<img id="slide" src="slide-01.png" alt="スライド1 / 30" width="1920" height="1080">
<div class="controls"><button id="prev" aria-label="前のスライド" disabled>← 前へ</button><output id="counter" aria-live="polite">1 / 30</output><button id="next" aria-label="次のスライド">次へ →</button><select id="page" aria-label="スライドを選択"><option value="1">1枚目</option><option value="2">2枚目</option><option value="3">3枚目</option><option value="4">4枚目</option><option value="5">5枚目</option><option value="6">6枚目</option><option value="7">7枚目</option><option value="8">8枚目</option><option value="9">9枚目</option><option value="10">10枚目</option><option value="11">11枚目</option><option value="12">12枚目</option><option value="13">13枚目</option><option value="14">14枚目</option><option value="15">15枚目</option><option value="16">16枚目</option><option value="17">17枚目</option><option value="18">18枚目</option><option value="19">19枚目</option><option value="20">20枚目</option><option value="21">21枚目</option><option value="22">22枚目</option><option value="23">23枚目</option><option value="24">24枚目</option><option value="25">25枚目</option><option value="26">26枚目</option><option value="27">27枚目</option><option value="28">28枚目</option><option value="29">29枚目</option><option value="30">30枚目</option></select></div>
<p><a id="original" href="slide-01.png" target="_blank" rel="noopener">表示中のスライドを拡大</a> · <a href="https://tools.ichisouzo-lab.com/slides/lecanemab-donanemab-comparison/" target="_blank" rel="noopener">別画面で全30枚を見る</a></p>
<div class="details"><p>RC7全30枚。左右キー・スワイプでも移動できます。資料確認日：2026年10月20日。個別の診療判断は担当医にご相談ください。根拠と条件は各スライドの注記・記事の出典をご確認ください。</p><p><a href="https://blog.ichisouzo-lab.com/entry/2026/10/21/064610" target="_blank" rel="noopener">解説記事・参考文献</a> · <a href="https://www.youtube.com/watch?v=Jyu9wJyQjgI" target="_blank" rel="noopener">解説動画</a></p></div></main>
<script>if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
// Existing medical-ddx-tools slide viewers use the same clamped page index,
// image replacement, disabled edge controls, keyboard and swipe interaction.
let current=1;const count=30;const image=document.getElementById('slide'),prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page');
function show(n){current=Math.max(1,Math.min(count,n));const src='slide-'+String(current).padStart(2,'0')+'.png';image.src=src;image.alt='スライド'+current+' / '+count;document.getElementById('original').href=src;document.getElementById('counter').textContent=current+' / '+count;page.value=String(current);prev.disabled=current===1;next.disabled=current===count;}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));page.addEventListener('change',()=>show(Number(page.value)));document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});let start=0;image.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>50)show(current+(d<0?1:-1))},{passive:true});</script></body></html>
